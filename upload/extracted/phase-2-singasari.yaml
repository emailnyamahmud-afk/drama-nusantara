kings_list:
  source_primary: "Pararaton (abad 16) + Negarakretagama pupuh 40-44 + prasasti"
  note: >
    5 raja Tumapel/Singasari. Tohjaya hanya disebut Pararaton, tidak di
    Negarakretagama (dianggap tidak sah).
  kings:
    - number: 1
      name: "Ken Arok"
      full_title: "Sri Ranggah Rajasa Bhatara Sang Amurwabhumi"
      reign: "1222–1227 M"
      source: "Pararaton, Negarakretagama pupuh 40-41"
      note: "Pendiri Wangsa Rajasa. Mantan pencuri-preman. Dibunuh Anusapati."
    - number: 2
      name: "Anusapati"
      full_title: "Sri Maharaja Anusapati"
      reign: "1227–1248 M"
      source: "Pararaton, Negarakretagama pupuh 42"
      note: "Anak biologis Tunggul Ametung & Ken Dedes. Membunuh Ken Arok."
    - number: 3
      name: "Panji Tohjaya"
      full_title: "Panji Tohjaya"
      reign: "1248 M (~beberapa bulan)"
      source: "Pararaton saja (TIDAK di Negarakretagama)"
      note: "Putra Ken Arok & Ken Umang (selir). Naik lewat kudeta melawan Anusapati."
    - number: 4
      name: "Wisnuwardhana"
      full_title: "Śrī Jayawisnuwarddhana Sang Mapāñji Seminingrat"
      alt_names: ["Ranggawuni", "Nararya Seminingrat", "Seminingrat"]
      reign: "1248–1268 M (wafat 1270/1272 menurut sumber berbeda)"
      source: "Prasasti Maribong 1248 M, Prasasti Mula Malurung 1255 M, Pararaton, Negarakretagama"
      note: "Putra Anusapati (versi Pararaton). Istri: Waning Hyun. Satu-satunya raja Singasari yang meninggal wajar."
    - number: 5
      name: "Kertanegara"
      full_title: "Sri Maharadiraja Kertanegara Wikrama Dharmottungadewa"
      reign: "1268–1292 M"
      source: "Pararaton, Negarakretagama pupuh 43-44, Prasasti Kudadu 1294 M"
      note: "Putra Wisnuwardhana & Waning Hyun. Penganut Buddha Tantrayana. Ekspedisi Pamalayu 1275-1286. Dibunuh Jayakatwang."
  parallel_figures:
    - name: "Mahisa Wonga Teleng"
      title: "Bhatara Parameswara"
      period: "± 1230 M"
      role: "Raja Kadiri bawahan Tumapel. Putra sulung Ken Arok & Ken Dedes. Leluhur raja-raja Majapahit."
      source: "Pararaton, Prasasti Mula Malurung 1255 M (identifikasi oleh Slamet Muljana)"
    - name: "Narasinghamurti"
      alt_name: "Mahisa Campaka"
      role: "Putra Mahisa Wonga Teleng. Sepupu & ipar Wisnuwardhana. Kakek Raden Wijaya."
    - name: "Jayakatwang"
      role: "Bupati Kadiri yang memberontak 1292 M, membunuh Kertanegara."
      source: "Pararaton, Negarakretagama, Kidung Harsawijaya"
    - name: "Raden Wijaya"
      alt_name: "Nararya Sanggramawijaya"
      regnal_name_majapahit: "Kertarajasa Jayawardhana"
      role: "Menantu Kertanegara. Pendiri Majapahit (1293 M)."
      source: "Pararaton, Negarakretagama pupuh 45-49, Prasasti Kudadu 1294 M"

