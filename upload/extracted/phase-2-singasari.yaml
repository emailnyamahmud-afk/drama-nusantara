# =============================================================================
# MASTER PHASE 2 — ERA SINGASARI / TUMAPEL (1222–1292 M)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT dengan cross-check ke sumber primer (Pararaton, Negarakretagama, prasasti)
# Tanggal: 17 Oktober 2026
# Versi: 1.0 (master YAML phase 2)
# =============================================================================

meta:
  era: "Singasari / Tumapel"
  periode: "1222–1292 M"
  lokasi_geografis: "Jawa Timur (Malang, Kediri, Pasuruan, Mojokerto)"
  dinasti: "Wangsa Rajasa (didirikan Ken Arok 1222 M)"
  ibu_kota: "Kutaraja (dekat Malang modern), kemudian Singasari (sejak Wisnuwardhana)"
  sumber_primer:
    - "Pararaton (Kitab Raja-Raja, abad 16, ditulis di Bali) - sumber utama naratif"
    - "Negarakretagama karya Mpu Prapanca (1365 M) pupuh 40-44 - silsilah resmi"
    - "Prasasti Mula Malurung (1255 M) - Wisnuwardhana & Bhatara Parameswara"
    - "Prasasti Maribong (1248 M) - Wisnuwardhana naik takhta"
    - "Prasasti Kudadu / Gunung Butak (1294 M) - Raden Wijaya & masyarakat Trawas"
    - "Kidung Harsawijaya - sumber sekunder naratif"
    - "Kidung Panji Wijayakrama - sumber sekunder"
  catatan_penting: >
    Berbeda dengan era Mataram Kuno, era Singasari memiliki DUA sumber sastra utama
    (Pararaton + Negarakretagama). Namun keduanya sering berbeda versi:
    - Pararaton mencatat kudeta dan pembunuhan (versi mitologis-naratif)
    - Negarakretagama menyajikan versi "halus" (panegirik resmi Majapahit)
    - Tohjaya TIDAK disebut di Negarakretagama (dianggap penguasa tidak sah)
    - Negarakretagama menyebut Anusapati sebagai putra Rangga Rajasa (bukan Tunggul Ametung)

# =============================================================================
# NARASI SINGKAT — Storytelling untuk Drama
# =============================================================================
narrative:
  era_overview: >
    Dari bayang-bayang Kerajaan Kediri yang tumbang, seorang pencuri-preman bernama
    Ken Arok merebut takhta lewat tipu daya dan keris terkutuk. Lahir Wangsa Rajasa —
    dinasti yang akan melahirkan Majapahit. Tapi takhta Singasari dibangun di atas
    kutukan: setiap raja naik lewat kudeta, dan mati dibunuh penerusnya. Ken Arok
    dibunuh Anusapati (anak tirinya yang balas dendam). Anusapati digulingkan
    Tohjaya (anak Ken Arok dari selir). Tohjaya digulingkan Wisnuwardhana.
    Hingga datang Kertanegara — raja terbesar Singasari, penganut Buddha Tantrayana
    yang mengirim ekspedisi Pamalayu, menaklukkan Bali, dan menolak upeti Mongol.
    Tapi Kertanegara dibunuh Jayakatwang dari Kediri — dendam lama yang kembali.
    Dari reruntuhan Singasari, Raden Wijaya (menantu Kertanegara) memanfaatkan
    pasukan Mongol untuk mengalahkan Jayakatwang, lalu berbalik menyerang Mongolnya
    sendiri — mendirikan Majapahit.

  akt_1_founding: >
    1222 M. Di ladang perang Ganter, dekat Malang, Ken Arok mengalahkan Kertajaya
    (raja Kediri terakhir). Sebelumnya, Ken Arok membunuh Tunggul Ametung (akuwu
    Tumapel) dengan keris Mpu Gandring, lalu menikahi Ken Dedes (istri korban).
    "Ibu para raja Jawa" — begitu Ken Dedes disebut, karena dari rahimnya lahir
    garis raja-raja Singasari-Majapahit. Ken Arok bergelar Sri Ranggah Rajasa
    Bhatara Sang Amurwabhumi — pendiri Wangsa Rajasa.

  akt_2_curse_of_mpu_gandring: >
    Keris Mpu Gandring mengutuk takhta. Anusapati (anak biologis Tunggul Ametung
    dari Ken Dedes) membunuh Ken Arok sebagai balas dendam. Tohjaya (anak Ken Arok
    dari selir Ken Umang) kudeta melawan Anusapati. Wisnuwardhana (putra Anusapati)
    kudeta melawan Tohjaya. Tiga generasi, tiga kudeta — semua dalam 26 tahun
    (1222-1248). Hanya Wisnuwardhana yang meninggal secara wajar di takhtanya.

  akt_3_consolidation_and_diplomacy: >
    Wisnuwardhana memerintah 20 tahun (1248-1268) — era stabil. Ia menyatukan
    kembali Kadiri dengan Tumapel, menikahi Waning Hyun (putri Mahisa Wonga
    Teleng, keturunan Ken Arok lewat garis lain). Dari pernikahan ini lahir
    Kertanegara — anak yang membawa dua garis Ken Arok dalam dirinya.

  akt_4_kertanegara_vision: >
    1268 M. Kertanegara naik takhta. Raja visioner, penganut Buddha Tantrayana
    esoterik. Ia mengirim Ekspedisi Pamalayu (1275-1286) ke Sumatra — menguasai
    Dharmasraya. Menaklukkan Bali (1284). Menolak tuntutan upeti Kubilai Khan —
    memotong telinga utusan Mongol Meng Qi (1289). Singasari menjadi kerajaan
    terkuat di Asia Tenggara. Tapi Kertanegara terlalu sibuk dengan ritual Tantra
    dan ekspansi, lupa pada ancaman internal.

  akt_5_fall_and_rebirth: >
    1292 M. Jayakatwang, bupati Kadiri yang dendam atas kekalahan 1222,
    menyerang istana Tumapel saat pasukan Singasari sedang di Sumatra.
    Kertanegara dibunuh saat upacara Tantra. Singasari runtuh.
    Tapi Raden Wijaya — menantu Kertanegara — selamat dengan berlindung di
    Kudadu (Trawas, Mojokerto), dibantu masyarakat lokal. 1293 M: pasukan
    Mongol-Yuan datang untuk menghukum Singasari (yang sudah runtuh).
    Raden Wijaya memanfaatkan Mongol untuk mengalahkan Jayakatwang, lalu
    berbalik menyerang Mongolnya sendiri — mendirikan Majapahit, melanjutkan
    garis Wangsa Rajasa.

