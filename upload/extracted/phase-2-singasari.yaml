      Mendapat keris Mpu Gandring dari empu yang ia bunuh karena kesabaran yang
      pendek, membunuh Tunggul Ametung, menikahi Ken Dedes (istri korban), merebut
      kekuasaan. 1222 M: mengalahkan Kertajaya (raja Kediri) di Pertempuran Ganter,
      mendirikan Wangsa Rajasa. Tewas dibunuh Anusapati (anak tirinya) 1227 M
      dengan keris Mpu Gandring yang sama. Anti-hero Nusantara paling ikonik.
