  aspek_yang_perlu_diperhatikan:
    - >
      Soeharto sering disambar sebagai "Bapak Pembangunan" tetapi juga
      dalang represi sistematis. Drama perlu seimbang — tunjukkan
      pencapaian ekonomi (swasembada beras 1984, pertumbuhan 7%)
      sekaligus korban (Petrus 1983-85, Santa Cruz 1991, Marsinah 1993).
    - >
      Kroni kapitalisme (Gang of Four) adalah karakter dramatik kuat —
      hubungan Liem-Soeharto bermula dari masa revolusi (1945-1949),
      masuk ke krisis 1997, lalu kejatuhan Mei 1998.
    - >
      ICMI 1990 adalah momen penting — Soeharto (sebelum 1990 dianggap
      "anti-Islam politik") tiba-tiba menggalang dukungan Islam (Habibie,
      Imaduddin, Adi Sasono). Ini memicu konflik dengan TNI kubu Merah
      Putih (Benny Moerdani, Try Sutrisno).
    - >
      Reformasi Mei 1998 — Trisakti (4 mahasiswa tewas), kerusuhan
      (1.000+ tewas, 168 perempuan diperkosa), penculikan aktivis
      (13 masih hilang), Soeharto mundur — semua terjadi dalam 9 hari.
      Momen paling dramatik dalam sejarah Indonesia modern.
    - >
      Tokoh seperti Marsinah (24 tahun) yang dibunuh 1993 —
      karakter idealis yang baik untuk drama. Tragedi buruh Indonesia
      era Orde Baru.
    - >
      Komando Jihad (1970-an) — operasi intelijen yang "backfired" —
      adalah kasus unik dalam drama kekuasaan. Ali Moertopo rekrut
      Hispran dan Danu dari penjara untuk mengorganisasi veteran DI/TII,
      tetapi mereka malah mengaktifkan kembali DI/TII.

  catatan_akhir: >
    Fase 10 ini adalah fase terakhir dari 10 fase drama Nusantara.
    Era Orde Baru berakhir dengan Reformasi 1998 — yang membuka era
    Reformasi (fase 11 jika diperlukan: Reformasi 1998-2014, fase 12:
    era Jokowi 2014-2024, fase 13: era Prabowo 2024-). Audit ini
    memperluas MD fase 10 dengan sub-bagian konflik politik internal
    (Malari, Petisi 50, NKK/BK, Asas Tunggal, Tanjung Priok, ICMI),
    pemberontakan & operasi militer (GAM, OPM, Komando Jihad,
    Talangsari, Petrus, Operasi Seroja, PEPERA, Santa Cruz), hubungan
    internasional (PBB 1966, ASEAN 1967, Malaysia 1966, APEC 1994,
    IMF 1997, Boat people), kroni kapitalisme (Gang of Four), dan
    runtuhnya Orde Baru (Krisis 1997, Trisakti, Kerusuhan Mei 1998,
    Penculikan, Mundur 21 Mei 1998). Total 12 top-level keys.
