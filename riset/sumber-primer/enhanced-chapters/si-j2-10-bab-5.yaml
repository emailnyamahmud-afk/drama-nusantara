title: "Bab V — Puncak Pencapaian Persilangan dengan Hindu dan Buddha"

summary: >
  Bab terpanjang di seluruh 5 jilid (89.372 kata). Membahas puncak pencapaian
  peradaban Hindu-Buddha di Nusantara, terutama Majapahit di bawah Hayam Wuruk
  (1350-1389) dan Mahapatih Gajah Mada. Membahas pula ide penyatuan Nusantara
  yang dimulai sejak Wisnuwardhana Singasari (Prasasti Mula Malurung 1255 M),
  diteruskan Kertanegara (Prasasti Camundi, ekspedisi Pamalayu 1275, arca
  Amoghapasa ke Dharmasraya 1286), dan mencapai puncaknya dengan Sumpah Palapa
  Gajah Mada 1331 M. Bab juga membahas Dinasti Girindra (Rajasawanda) di
  Majapahit Akhir, periode Wikramawardhana (1389-1427), Perang Paregreg
  1404-1406, hingga runtuhnya Majapahit 1478/1527. Membahas hubungan maritim
  Majapahit dengan Tiongkok (Dinasti Ming), Siam, Champa, Kamboja, India, dan
  kerajaan-kerajaan Nusantara bawahan.

