# =============================================================================
# CATATAN PENGGUNAAN
# =============================================================================
catatan:
  coverage: >
    5 jilid Kemenbud 2025 mencakup periode prasejarah hingga 1900 M.
    Untuk fase drama 8 (1945-1949), 9 (1950-1965), 10 (1966-1998),
    gunakan sumber primer lain yang sudah ada di file YAML fase masing-masing.

  kualitas_sumber: >
    Sumber resmi terbitan pemerintah Indonesia (Kemenbud RI 2025).
    Ditulis oleh tim sejarawan Indonesia, diawasi Kementerian Kebudayaan.
    Lebih otoritatif daripada Wikipedia untuk produksi drama formal.
    Setiap bab sudah ditag ontology (era, region, topics) di frontmatter
    YAML-nya.

  cara_pakai_untuk_drama: >
    1. Pilih drama yang ingin ditulis (mis. drama-04-walisongo)
    2. Lihat 'prioritas_baca' di index ini untuk tahu bab mana yang harus dibaca
    3. Buka file bab di folder jilid-X/ yang sesuai
    4. Ekstrak detail tokoh, lokasi, kostum, dan scene drama
    5. Cross-check dengan file YAML fase (mis. yaml/phase-4-demak.yaml) untuk
       menambah data yang belum ada

  hak_cipta: >
    Buku ini terbitan Kementerian Kebudayaan Republik Indonesia 2025.
    Penggunaan untuk tujuan edukasi dan riset diperbolehkan. Untuk
    produksi komersial, hubungi penerbit (pustakabudaya.id).
    Konversi markdown dilakukan oleh Akhmad Mahmud & Asisten AI GLM 5.2
    dari Yayasan Jaya Sanga Nusantara menggunakan pymupdf4llm.
