production_notes:

  color_palette_overall:
    description: >
      Palet warna keseluruhan era Mataram Kuno harus earth-tone matte,
      dengan kilau emas perhiasan sebagai aksen dramatik.
    primary_colors:
      - "Coklat tanah"
      - "Merah bata"
      - "Kuning gambir"
      - "Hitam jelaga"
      - "Krem sutera"
    accent_colors:
      - "Emas (perhiasan dan makuta)"
      - "Saffron (jubah Buddha)"
      - "Biru tua (kain jedor raja)"
      - "Hijau zaitun (jubah Airlangga)"
    forbidden_colors:
      - "Warna sintetis cerah (tidak ada di era Mataram Kuno)"
      - "Merah mencolok modern (gunakan merah bata alami)"

  texture_palette:
    fabric:
      - "Sutera tipis (impor Tiongkok-India)"
      - "Katun kasar (lokal)"
      - "Kain kulit kayu (rakyat jelata)"
    metal:
      - "Emas (perhiasan, makuta)"
      - "Perunggu (kawaca, perisai, topi prajurit)"
      - "Tembaga (gelang sederhana)"
    stone:
      - "Andesit (candi)"
      - "Bata merah (istana)"

  sound_design:
    ambient:
      - "Gemerincing lonceng kecil pada kain wanita bangsawan (detail Borobudur)"
      - "Denting gong perunggu"
      - "Kidung mantera Buddha"
      - "Suara air terjun di lereng Dieng"
    music:
      - "Gamelan perunggu kuno (untuk upacara)"
      - "Suling bambu (untuk suasana damai)"
      - "Kidung kakawin (puisi Sankrit-Kawi)"

  cultural_authenticity:
    important_details:
      - "Tidak ada sepatu untuk raja/bangsawan — telanjang kaki (tradisi Jawa kuno)"
      - "Dada terbuka untuk raja Hindu (dengan upavita)"
      - "Rambut selalu disanggul (jatamakuta untuk pria, kondé untuk wanita)"
      - "Perhiasan emas berlimpah untuk bangsawan"
      - "Rakyat jelata memakai kain kasar atau kulit kayu"
      - "Batik terbatas, motif geometris sederhana (parang, kawung, lereng)"

