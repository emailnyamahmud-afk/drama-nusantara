title: "Bab VII — Wali Songo Mengislamkan Jawa"

# --- RINGKASAN ISI BAB ---
summary: >
  Bab ini membahas peran Wali Songo (sembilan wali) dalam proses Islamisasi
  Jawa abad 14-16 M. Dibahas dalam dua perspektif: historiografi tradisional
  (Babad Tanah Jawi, Serat Babak Demak, Babad Gresik) dan realitas sejarah
  yang dapat diverifikasi. Bab memprofilkan 9 wali secara detail (Maulana
  Malik Ibrahim, Sunan Ampel, Sunan Bonang, Sunan Drajat, Sunan Giri, Sunan
  Kudus, Sunan Kalijaga, Sunan Muria, Sunan Gunung Jati), pola dakwah mereka
  (akomodatif terhadap budaya lokal Hindu-Buddha), serta peninggalan
  arsitektur (Masjid Agung Demak 1466, Masjid Sunan Ampel 1421, Masjid
  Menara Kudus 1549, Masjid Sang Cipta Rasa Cirebon 1480). Bab menekankan
  strategi kultural Sunan Kalijaga (wayang, gamelan, tembang) dan pendekatan
  politik Sunan Ampel-Sunan Giri (institusionalisasi Islam via kerajaan
  Demak).

reading_time_minutes: 141

# --- KEY FIGURES (9 wali + tokoh pendukung) ---
key_figures:

  - name: "Maulana Malik Ibrahim (Sunan Gresik)"
    role: "Wali, pendakwah, ahli multi-disiplin (bertani, pengobatan, pelayaran, pendidikan)"
    period: "± 1380-1419 M (wafat 1419 M di Gresik)"
    drama_relevance: high
    notes: >
      Dianggap sebagai wali tertua. Membujuk Raja Vikramavarddhana Majapahit
      (1386-1429) untuk memeluk Islam. Diberi tanah perdikan oleh Prabu
      Brawijaya I. Dimakamkan di Gresik.

  - name: "Raden Rahmat / Sunan Ampel"
    role: "Wali, pendakwah, perintis tarekat Naqsyabandiyah di Jawa"
    period: "Lahir ± 1401 M di Champa, wafat 1481 M di Surabaya"
    drama_relevance: high
    notes: >
      Nama asli Raden Rahmat, lahir di Champa (Vietnam). Membangun Ampeldenta
      di Surabaya. Mengajarkan maw'izah al-hasanah (nasihat baik) dan dialog.
      Diangkat sebagai penghulu kesultanan Demak 1521 M.

  - name: "Makdum Ibrahim (Sunan Bonang)"
    role: "Wali, ahli fikih, usuluddin, tasawuf, seni, arsitektur, sastra, beladiri"
    period: "Lahir ± 1465 M di Lasem, wafat 1525 M di Tuban"
    drama_relevance: high
    notes: >
      Putra Sunan Ampel. Belajar ke Syekh Maulana Ishak di Pasai (aceh).
      Penghulu pertama kesultanan Demak (1490-1506 M). Dimakamkan di
      Kompleks Pemakaman Desa Kutorejo, Tuban.

  - name: "Raden Syarifuddin (Sunan Drajat)"
    role: "Wali, pendakwah via kesenian (tembang pangkur, gamelan)"
    period: "Lahir ± 1470 M di Ampeldenta, wafat ± 1522 M"
    drama_relevance: medium
    notes: >
      Putra Sunan Ampel dan Nyai Ageng Manila (Dewi Candrawati, putri Bupati
      Tuban Arya Teja). Berdakwah di Kampung Ghendingan dengan iringan
      gamelan dan tembang pangkur.

  - name: "Muhammad Ainul Yaqin (Sunan Giri)"
    role: "Wali, pendiri Giri Kedaton (pemerintahan + agama)"
    period: "Lahir 1443 M di Blambangan, wafat 1505 M"
    drama_relevance: high
    notes: >
      Putra Syekh Maulana Ishak dan Dewi Sekardadu (anak Raja Blambangan
      Bhre Wirabhumi, keturunan Hayam Wuruk). Mendirikan Giri Kedaton 1485 M,
      dikukuhkan 9 Maret 1487 M oleh para wali dan Raden Fatah. Berwenang
      mengesahkan raja-raja Jawa Muslim (Demak, Pajang, Mataram).

  - name: "Ja'far Sadiq (Sunan Kudus)"
    role: "Wali, ulama sufi, saudagar kaya, senopati Demak"
    period: "Lahir ± 1500 M di Jipang Panolan (Blora), wafat 5 Mei 1550 M di Kudus"
    drama_relevance: high
    notes: >
      Putra R. Usman Haji (Sunan Ngudung), senopati Bintoro Demak. Penghulu
      kesultanan Demak 1524-1550 M (gantikan Sunan Bonang 1506). Mendirikan
      Masjid Menara Kudus 1549 M. Terkenal dengan kebijakan makan sate
      kerbau (bukan sapi) untuk hormati Hindu.

  - name: "Raden Umar Said (Sunan Muria)"
    role: "Wali, pendakwah pantai utara Jawa"
    period: "Lahir ± 1450 M di lereng Gunung Muria"
    drama_relevance: medium
    notes: >
      Putra Sunan Kalijaga dan Dewi Sarah binti Maulana Ishak. Menikah dengan
      Dewi Sujinah (adik Sunan Kudus). Berdakwah di Pati, Tayu, Jepara,
      Juana, Kudus, dan sekitarnya.

  - name: "Sunan Kalijaga"
    role: "Wali, arsitek, budayawan (wayang, gamelan, tembang)"
    period: "± 1450-1513 M (versi umum)"
    drama_relevance: high
    notes: >
      Tokoh paling terkenal di kalangan Jawa. Berdakwah via wayang, gamelan,
      tembang. Arsitek Masjid Agung Demak — membuat sakaguru (tiang utama)
      dari tatal (pecahan kayu yang disatukan), julukan Sakatatal. Mendesain
      Masjid Sang Cipta Rasa Cirebon juga.

  - name: "Syarif Hidayatullah (Sunan Gunung Jati)"
    role: "Wali, pendiri Kesultanan Cirebon"
    period: "± 1448-1568 M (versi panjang), memimpin Cirebon ± 1483-1568 M"
    drama_relevance: high
    notes: >
      Pendiri Cirebon sebagai kesultanan. Memimpin Giri Kedaton setelah
      Sunan Giri wafat. Membangun Keraton Kasepuhan (Pakungwati) sebagai
      pusat pemerintahan + media dakwah.

  - name: "Raden Fatah / Raden Patah"
    role: "Sultan Demak pertama, pendiri Kerajaan Demak"
    period: "± 1455-1518 M (sumber: 1455-1588 M versi panjang)"
    drama_relevance: high
    notes: >
      Putra Prabu Brawijaya V Majapahit dengan putri Tionghoa. Bergabung
      Wali Songo periode IV, menggantikan Maulana Ahmad Jumadil Kubra.
      Mendirikan Demak perempat akhir abad 15 M.

  - name: "Prabu Brawijaya V"
    role: "Raja Majapahit terakhir"
    period: "± 1465-1478 M (versi umum), atau ± 1456-1518 M (versi panjang)"
    drama_relevance: medium
    notes: >
      Raja Majapahit akhir. Memberi izin tanah perdikan ke Maulana Malik
      Ibrahim. Ayah Raden Patah. Hubungannya dengan Walisongo kompleks:
      ayah dari sultan Demak pertama.

  - name: "Sultan Trenggana"
    role: "Sultan Demak ketiga, puncak ekspansi Demak"
    period: "± 1521-1546 M"
    drama_relevance: medium
    notes: >
      Penerus Pati Unus. Memperluas Demak ke Jawa Timur (Pasuruan,
      Blambangan, Panarukan). Hubungan dengan Sunan Kudus sebagai penghulu.

