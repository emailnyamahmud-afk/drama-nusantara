title: "Bab II — Hegemoni Kekuasaan dan Diplomasi di Nusantara Abad XVII-XVIII"

summary: >
  Bab kunci untuk memahami dinamika politik Nusantara abad 17-18, dengan
  fokus pada tiga kesultanan Islam besar: Aceh (Iskandar Muda), Mataram
  (Sultan Agung), dan Gowa-Tallo (Sultan Hasanuddin). Bab menantang narasi
  kolonial yang sentral-Eropa dengan menempatkan kesultanan Nusantara
  sebagai aktor utama dengan horizon politik global. Membahas ekspansi
  Sultan Agung ke Jawa Timur (Pasuruan 1614, Wirasaba 1615, Surabaya 1625,
  Giri-Gresik 1636), serangan Mataram ke Batavia 1628 dan 1629 (gagal),
  strategi politik pernikahan Pangeran Pekik, islamisasi Sultan Agung
  pasca-kekalahan Batavia (kalender Jawa 1633, ziarah Tembayat), hingga
  pemberontakan internal (Tembayat 1630). Bab juga membahas hubungan Aceh
  dengan Turki Usmani dan ekspansi Iskandar Muda ke Johor (1613) dan
  Malaka-Portugis (1615, 1629 gagal).

reading_time_minutes: 154

key_figures:

  - name: "Sultan Agung (Raden Mas Jatmiko / Pangeran Rangsang)"
    role: "Sultan Mataram ketiga, ekspansi dan serang Batavia"
    period: "1613-1645 M (lahir ± 1593, naik takhta usia 20-an)"
    drama_relevance: high
    notes: >
      Sultan Agung Senapati ing Ngalaga Abdurrahman. Putra tertua Panembahan
      Seda ing Krapyak (raja Mataram ke-2). Garwa padmi: Ratu Adi asal Pajang.
      Ekspansi Jawa: Pasuruan 1614, Wirasaba 1615, Lasem 1616, Pasuruan 1617,
      Tuban 1619, Surabaya 1625, Giri-Gresik 1636. Serang VOC Batavia 1628
      dan 1629 (gagal). Ziarah Tembayat 1633 — islamisasi.

  - name: "Iskandar Muda"
    role: "Sultan Aceh, ekspansi ke Sumatera dan Malaka"
    period: "1607-1636 M"
    drama_relevance: high
    notes: >
      Ekspansi ke Deli 1612, Aru 1613, Johor 1613 (serang VOC di Batu Sawar),
      Pahang 1617, serang Malaka-Portugis 1615 dan 1629 (gagal besar — 19.000
      prajurit tewas). Hubungan diplomatik dengan Turki Usmani.

  - name: "Sultan Hasanuddin"
    role: "Sultan Gowa, melawan VOC"
    period: "1653-1669 M"
    drama_relevance: high
    notes: "Peperangan Makassar-VOC 1666-1669, Perjanjian Bungaya 1669."

  - name: "Pangeran Pekik"
    role: "Putra Jayalengkara (Surabaya), menantu Sultan Agung"
    period: "± 1620-1630-an M"
    drama_relevance: medium
    notes: >
      Dinikahkan dengan Ratu Pandan Sari (adik Sultan Agung). Putrinya
      dinikahkan dengan Amangkurat I. Memimpin serangan Mataram ke Giri-Gresik
      1636 karena keturunan Walisongo. Pengarang Serat Jayalengkara Wulang,
      suluk, Damarwulan.

  - name: "Jan Pieterszoon Coen"
    role: "Gubernur Jenderal VOC di Batavia"
    period: "1619-1623, 1627-1629 M"
    drama_relevance: high
    notes: "Pendiri Batavia 1619. Menolak bantu Sultan Agung serang Surabaya. Wafat 1629."

  - name: "Jayalengkara"
    role: "Adipati Surabaya, takluk ke Mataram 1625"
    period: "± 1610-1625 M"
    drama_relevance: medium
    notes: "Surabaya dikepung Mataram, kelaparan, populasi 50-60 ribu turun ke 1.000."

  - name: "Amangkurat I"
    role: "Putra Sultan Agung, Sultan Mataram ke-4"
    period: "1646-1677 M"
    drama_relevance: medium
    notes: "Suami putri Pangeran Pekik. Tirani, kerusuhan istana 1647-1653."

  - name: "Sunan Giri (Giri Kedaton)"
    role: "Raja-ulama Gresik, takluk Mataram 1636"
    period: "± 1600-1636 M"
    drama_relevance: medium
    notes: "Penerus Sunan Giri asli. Pusat politik-agama Islam pesisir, ditaklukkan Sultan Agung 1636."

