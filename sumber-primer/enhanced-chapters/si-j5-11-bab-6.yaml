title: "Bab VI — Pemberontakan dan Perlawanan: Dari Resistensi Lokal menuju Pengalaman Kolektif Perlawanan Kolonial"

summary: >
  Bab kunci untuk drama pemberontakan abad 19. Membahas peralihan dari
  resistensi lokal sporadis ke pengalaman kolektif perlawanan kolonial
  Hindia Belanda. Mencakup Perang Diponegoro (1825-1830) di Yogyakarta,
  Perang Padri (1803-1838) di Sumatera Barat, Perang Aceh (1873-1904)
  di Aceh, Pemberontakan Banten 1888, dan berbagai pemberontakan lokal
  lainnya abad 19. Bab menekankan evolusi strategi perlawanan: dari
  perang fisik ke perlawanan kultural-organisasi (awal kebangkitan
  nasional).

reading_time_minutes: 109

