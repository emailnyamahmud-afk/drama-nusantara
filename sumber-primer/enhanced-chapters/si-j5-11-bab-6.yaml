      1803-1838 (35 tahun). Belanda dukung Kaum Adat untuk lemahkan
      Padri. Ditangkap via tipu 1837. Dibuang ke Cianjur, lalu Ambon
      (1839), lalu Manado (1844), wafat di Manado 1864.

