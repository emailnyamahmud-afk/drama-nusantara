title: "Bab III — Dinamika Politik Kerajaan Nusantara"

summary: >
  Bab paling penting untuk riset drama Nusantara fase Hindu-Buddha. Membahas
  dinamika politik kerajaan-kerajaan Nusantara abad 4-16 M: Kutai (Mulawarman),
  Tarumanagara (Purnawarman), Kalingga (Ratu Shima), Sriwijaya (Dapunta Hyang,
  Balaputradewa, Samaratungga), Melayu-Jambi (Adityawarman), Mataram Kuno
  (Sanjaya, Rakai Pikatan, Pramodawardhani, Balitung), Singasari (Ken Arok,
  Kertanegara), Majapahit (Raden Wijaya, Hayam Wuruk, Gajah Mada), hingga
  transisi ke era Islam. Membahas pula serangan Chola 1025 M ke Sriwijaya,
  ekspedisi Pamalayu, dan hubungan diplomatik dengan Tiongkok (Dinasti Tang,
  Song) dan India (Pallava, Chola).

reading_time_minutes: 380

