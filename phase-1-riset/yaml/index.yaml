# =============================================================================
# INDEX MASTER — RISET DRAMA NUSANTARA (10 ERA)
# =============================================================================
# File ini adalah index/pintu masuk ke 10 file YAML per fase.
# Setiap fase = 1 era sejarah Nusantara dengan struktur data terstandarisasi.
#
# Cara pakai:
#   1. Baca index.yaml ini untuk navigasi cepat antar era
#   2. Buka file fase spesifik di subdirektori yang sama untuk data detail
#   3. Setiap file YAML fase berisi: meta, narrative, characters, locations,
#      wardrobe, prompt_library, production_notes (+ keys khusus per era)
#
# Update terakhir: 17 Oktober 2026
# Total: 10 fase, ~9.200 baris YAML, ~17.500 kata MD
# =============================================================================

project:
  name: "Riset Drama Nusantara — 10 Era"
  description: >
    Dokumen riset komprehensif untuk produksi drama historis Nusantara
    lintas-zaman: dari Mataram Kuno (732 M) hingga Orde Baru (1998 M).
    Materi dipecah menjadi (1) dokumen MD naratif tunggal untuk penulis naskah,
    (2) 10 file YAML master per fase untuk database T2I prompt generation.
  version: "1.0"
  last_updated: "2026-10-17"
  language: "Bahasa Indonesia"
  author: "Z.ai Research"

structure:
  root_directory: "riset-drama-nusantara/"
  md_directory: "md/"
  yaml_directory: "yaml/"
  files:
    md:
      path: "md/riset-drama-nusantara.md"
      type: "markdown narrative document"
      lines: 2325
      words: ~17500
      purpose: >
        Sumber bacaan utama untuk penulis naskah drama, sejarawan, dan
        creative director. Berisi narasi sejarah 10 era, visual & kostum,
        arsitektur, tokoh kunci (5-15 per fase), dan prompt SD siap pakai.
    yaml_index:
      path: "yaml/index.yaml"
      type: "YAML navigation index"
      purpose: >
        Index ke 10 file YAML fase. Berisi ringkasan meta per fase,
        statistik, dan tips penggunaan.
    yaml_phases:
      count: 10
      total_lines: ~9200
      purpose: >
        Database terstruktur per fase untuk AI prompt engineering (T2I),
        art direction, dan kontrol konsistensi visual. Setiap fase berisi
        9-13 top-level keys.

