# =============================================================================
# POLA STRUKTUR YANG KONSISTEN LINTAS FASE
# =============================================================================
structural_pattern:
  common_keys:
    - meta: info era, periode, penguasa, ibu_kota, agama, sumber_primer, catatan_penting
    - narrative: era_overview + 3-4 akt narasi
    - characters: tokoh dengan prompt_t2i
    - locations: lokasi dengan prompt_t2i
    - wardrobe: jenis busana dengan prompt_t2i
    - prompt_library: historical moments + karakter potraits
    - production_notes: palet warna, tipografi, casting, referensi
  era_specific_keys:
    phase_1: [kings_list, prasasti_list]
    phase_2: [kings_list, succession_wars]
    phase_3: [kings_list, succession_wars, prime_ministers]
    phase_4: [sultans_list, walisongo]
    phase_5: [kings_list, panembahan_senapati_transition]
    phase_6: [kings_list, succession_wars, keraton_split]
    phase_7: [rebellions, rebellion_characters, colonial_periods]
    phase_8: [marxist_timeline]
    phase_9: [internal_conflicts, rebellions, g30s_1965, international_relations]
    phase_10: [internal_conflicts, rebellions, military_operations, international_relations, crony_capitalism, fall_of_orde_baru]

# =============================================================================
# PETUNJUK PENGGUNAAN
# =============================================================================
usage_guide:
  for_scriptwriter:
    - "Baca file MD utama: md/riset-drama-nusantara.md"
    - "Pilih era yang relevan dengan naskah"
    - "Telusuri tokoh kunci + latar sejarah di sub-bagian terkait"
    - "Lihat production_notes untuk palet warna + casting tips"

  for_art_director:
    - "Buka file YAML fase spesifik di folder yaml/"
    - "Lihat key 'wardrobe' untuk referensi kostum + prompt_t2i"
    - "Lihat key 'locations' untuk referensi setting + prompt_t2i"
    - "Lihat key 'production_notes' → palet_warna, tipografi_rekomendasi"

  for_ai_prompt_engineer:
    - "Buka key 'prompt_library' di file YAML fase target"
    - "Sub-key 'historical_moments' → scene prompts siap pakai"
