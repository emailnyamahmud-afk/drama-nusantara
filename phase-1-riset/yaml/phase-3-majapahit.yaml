        grand hall with carved red teak pillars and tumpang roof, sultan on
        golden throne with golden umbrella (chatra), courtiers in velvet robes
        and makuta crowns gathered around, gamelan perunggu orchestra on side,
        incense smoke, warm candlelight, hyperrealistic cinematic, hyperdetailed
        8k masterpiece.

