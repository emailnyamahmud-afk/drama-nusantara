locations:

  trowulan_capital:
    name: "Trowulan — Ibu Kota Majapahit"
    location: "Kecamatan Trowulan, Kabupaten Mojokerto, Jawa Timur"
    era_active: "1293–1466 M (kemudian pindah ke Daha)"
    religion: "Hindu Siwa-Buddha sinkretis"
    narrative_short: >
      Ibu kota Kerajaan Majapahit. Diperkirakan berpenduduk 100.000-200.000 jiwa
      — kota terbesar di Asia Tenggara pada abad ke-14. Negarakretagama
      menggambarkan istana raja dengan paviliun-paviliun bertingkat (rajasthana),
      alun-alun luas, pasar besar dengan pedagang multinasional, taman-taman
      keraton (tamansari), serta kompleks candi dalam kota. Arkeologi Trowulan
      menemukan kanal-kanal air, kolam-kolam kerajaan (Kolam Segaran), gerbang-
      gerbang bata merah, dan ratusan fragmen keramik Tiongkok.
    landmarks:
      - "Kolam Segaran (kolam kerajaan)"
      - "Gerbang Bajang Ratu"
      - "Gerbang Wringin Lawang"
      - "Candi Brahu"
      - "Candi Tikus"
      - "Situs Trowulan Museum"
      - "Kanal-kanal bata merah"
    prompt_t2i:
      landscape: >
        Cinematic landscape of Trowulan capital city of Majapahit 14th century,
        bustling metropolis with red-brick canal system, Chinese Song Dynasty
        merchants in silk robes, Tamil traders in white veshti, Arab traders in
        robes and turbans, Javanese nobility in golden kemben, horse carriages
        and ox carts on cobblestone streets, pavilion palace with red teak roof
