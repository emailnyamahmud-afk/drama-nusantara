# =============================================================================
# MASTER PHASE 3 — ERA MAJAPAHIT (1293–1527 M)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT dengan cross-check ke sumber primer (Negarakretagama, Pararaton,
#         Kidung Sunda, prasasti)
# Tanggal: 17 Oktober 2026
# Versi: 1.0 (master YAML phase 3)
# =============================================================================

meta:
  era: "Majapahit"
  periode: "1293–1527 M"
  lokasi_geografis: "Jawa Timur (Trowulan/Mojokerto, Kediri, Blambangan/Lumajang)"
  dinasti: "Wangsa Rajasa (kelanjutan dari Singasari), lalu Girindrawardhana (akhir)"
  ibu_kota: "Trowulan (Mojokerto) → Daha/Kediri (periode akhir)"
  sumber_primer:
    - "Negarakretagama karya Mpu Prapanca (1365 M) - pupuh 45-49 silsilah Majapahit, seluruh teks untuk era Hayam Wuruk"
    - "Pararaton (Kitab Raja-Raja, abad 16) - sumber naratif untuk Jayanegara, pemberontakan Ra Kuti, Perang Paregreg"
    - "Kidung Sunda - sumber utama untuk Peristiwa Bubat 1357"
    - "Kidung Harsawijaya - sumber sekunder naratif"
    - "Prasasti Kudadu (1294 M) - Raden Wijaya & masyarakat Trawas"
    - "Piagam Sidateka (1323) - Jayanegara"
    - "Prasasti Jiyu (1489 M) - Girindrawardhana"
    - "Prasasti Petak - Girindrawardhana"
    - "Berita Cina Dinasti Ming - ekspedisi Mongol-Yuan 1293 dan hubungan Majapahit-Ming"
  catatan_penting: >
    Era Majapahit memiliki sumber primer paling lengkap dari semua era kuno Nusantara.
    Negarakretagama adalah sumber resmi panegirik (tidak menyebut aib Majapahit seperti Bubat).
    Pararaton dan Kidung Sunda mencatat versi naratif termasuk tragedi. Sumpah Palapa (1336 M)
    hanya tercatat di Pararaton, tidak di Negarakretagama.

# =============================================================================
# NARASI SINGKAT — Storytelling untuk Drama
# =============================================================================
narrative:
  era_overview: >
    Dari reruntuhan Singasari yang dibakar Jayakatwang, Raden Wijaya membangun
    Majapahit — kerajaan terbesar dalam sejarah Nusantara. Lahir dari tipu daya:
    memanfaatkan pasukan Mongol-Yuan untuk mengalahkan Jayakatwang, lalu berbalik
    menyerang sekutu Mongolnya sendiri. Selama 134 tahun, Majapahit mengalami
    pasang surut — dari konsolidasi awal, keemasan Hayam Wuruk-Gajah Mada dengan
    Sumpah Palapa, tragedi Bubat, perang saudara Paregreg, hingga keruntuhan
    perlahan dan akhirnya serangan Demak 1527.

  akt_1_founding: >
    1293 M. Raden Wijaya memanfaatkan ekspedisi Mongol-Yuan (20.000 pasukan
    Kubilai Khan) untuk mengalahkan Jayakatwang. Lalu ia berbalik menyerang
    Mongolnya sendiri — mengusir mereka dari Jawa. Majapahit didirikan di
    Trowulan, Mojokerto. Raden Wijaya bergelar Kertarajasa Jayawardhana.
    Nama "Majapahit" berasal dari pohon maja yang berbuah pahit — simbol
    kepahitan perjuangan.

  akt_2_consolidation: >
    Raden Wijaya wafat 1309. Jayanegara (Kala Gemet) naik takhta — pemerintahan
    lemah dengan banyak pemberontakan (Ranggalawe, Nambi, Ra Kuti 1319). Gajah Mada
    muncul sebagai penyelamat — membebaskan istana dari pemberontakan Ra Kuti.
    Jayanegara wafat 1328 tanpa ahli waris. Tribhuwana Tunggadewi (saudarinya)
    naik takhta — ratu yang berani. Mengangkat Gajah Mada sebagai patih 1336.
    Saat itulah Gajah Mada mengucapkan Sumpah Palapa.

  akt_3_golden_age: >
    1350 M. Hayam Wuruk naik takhta usia 16 tahun. Puncak keemasan Majapahit.
    Gajah Mada menaklukkan Bali, Palembang, Melayu, dll. Majapahit menjadi
    imperium maritim terbesar di Asia Tenggara. Tapi 1357 — Peristiwa Bubat.
    Gajah Mada menuntut Dyah Pitaloka (putri Sunda) sebagai tanda taklukan,
    bukan sebagai permaisuri untuk Hayam Wuruk. Raja Sunda Linggabuana marah.
    Pertempuran pecah — semua tewas termasuk Dyah Pitaloka. Hubungan
    Majapahit-Sunda rusak permanen. Gajah Mada wafat 1364.

  akt_4_civil_war: >
    Hayam Wuruk wafat 1389. Wikramawardhana (menantu) naik takhta. Tapi
    Bhre Wirabhumi (putra Hayam Wuruk dari selir) klaim takhta — membangun
    istana Timur di Pamotan/Lumajang. Perang Paregreg 1404-1406 — perang
    saudara Majapahit Barat vs Majapahit Timur. Bhre Wirabhumi kalah, dipenggal
    oleh Raden Gajah. Majapahit lemah — banyak wilayah taklukan merdeka.

  akt_5_decline_and_fall: >
    Setelah Perang Paregreg, Majapahit melemah perlahan. Suhita (1429-1447)
    membalas dendam kematian ayahnya. Kertawijaya, Rajasawardhana, Purwawisesa —
    raja-raja singkat. Singhawikramawardhana pindah ke Daha (Kediri) 1466.
    Girindrawardhana Dyah Ranawijaya (1474-1518) — raja terakhir di Daha.
    Naiknya Islam di pesisir utara Jawa. Serangan Demak 1527 mengakhiri
    sisa-sisa Majapahit. Akhir era Hindu-Buddha di Jawa.

