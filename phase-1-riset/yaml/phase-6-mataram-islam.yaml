# =============================================================================
# MASTER PHASE 6 — ERA MATARAM ISLAM (1587–1755 M)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT 2 — Diperluas dengan 3 Perang Suksesi, 4 Keraton, Untung Surapati,
#         Raden Mas Said, detail lengkap 11 raja
# Tanggal: 17 Oktober 2026
# Versi: 2.0 (master YAML phase 6 — diperluas)
# =============================================================================

meta:
  era: "Kesultanan Mataram Islam"
  periode: "1587–1755 M"
  lokasi_geografis: "Jawa Tengah-Yogyakarta (Kota Gede → Karta → Plered → Kartasura → Surakarta/Yogyakarta)"
  dinasti: "Wangsa Mataram (keturunan Ki Ageng Pemanahan → Sutawijaya)"
  ibu_kota: "Kota Gede (1587-1613) → Karta (1613-1645) → Plered (1645-1680) → Kartasura (1680-1745) → Surakarta/Yogyakarta (1745/1755)"
  agama: "Islam Sunni (sinkretis Jawa)"
  sumber_primer:
    - "Babad Tanah Jawi (abad 18-19) — sumber utama naratif"
    - "Babad Mataram — untuk era awal (Senapati-Sultan Agung)"
    - "Serat Kanda dan Serat Menak — sumber sekunder"
    - "Arsip VOC — untuk hubungan Mataram-Belanda (era Amangkurat dan setelahnya)"
    - "H.J. de Graaf dan T.H. Pigeaud — kajian akademis modern"
    - "Moedjianto (1987) Konsep Kekuasaan Jawa"
    - "Perjanjian Giyanti (13 Februari 1755) — pembagian Mataram"
  catatan_penting: >
    Tidak ada prasasti resmi dari era Mataram awal (Senapati-Sultan Agung).
    Sejarah direkonstruksi dari Babad Tanah Jawi. Arsip VOC menjadi sumber
    Eropa penting untuk era Amangkurat dan setelahnya. 11 raja dari Senapati
    hingga Hamengkubuwana I.

# =============================================================================
# NARASI SINGKAT — Storytelling untuk Drama
# =============================================================================
narrative:
  era_overview: >
    Dari Kota Gede di kaki Gunung Merapi, Sutawijaya mendirikan Mataram Islam
    — kerajaan Islam terbesar di Jawa. Selama 168 tahun, Mataram mengalami
    pasang surut: dari pendirian, keemasan Sultan Agung yang menyerang Batavia
    dan membuat kalender Jawa, kemunduran di bawah Amangkurat yang tiran,
    pemberontakan Trunojoyo, perang suksesi yang dimanipulasi VOC, hingga
    akhirnya pembelahan Mataram menjadi Surakarta dan Yogyakarta oleh
    Perjanjian Giyanti 1755.

  # SUMBER KEMENBUD 2025 (Jilid 4 Bab 2) — Detail ekspansi Sultan Agung
  sultan_agung_ekspansi_detail:
    sumber: "Kemenbud RI 2025, Jilid 4 Bab 2 'Hegemoni Kekuasaan dan Diplomasi di Nusantara Abad XVII-XVIII'"
    identitas_sultan_agung: >
      Bernama kecil Raden Mas Jatmiko, kemudian Pangeran Rangsang. Naik takhta
      1613 M usia 20-an, bergelar Sultan Agung Senapati ing Ngalaga Abdurrahman.
      Putra tertua Panembahan Seda ing Krapyak (raja Mataram ke-2, bertakhta
      1601-1613) dengan garwa padmi Ratu Adi asal Pajang. Pernyataan politik
      Sultan Agung: "Aku adalah seorang raja sekaligus tentara, bukan pedagang
      seperti raja-raja Jawa lain" — definisi budaya politik Jawa pedalaman
      yang menganggap pesisir sebagai ancaman.

    kronologi_ekspansi_1614_1636:
      1614:
        event: "Ekspansi pertama: Pasuruan ditaklukkan via Winongan, Malang dikuasai tanpa perlawanan"
        strategis: "Jalur masuk Jawa Timur"
      1615:
        event: "Wirasaba (Mojoagung) ditaklukkan — strategis lembah Brantas, dekat peninggalan Majapahit, memperkuat legitimasi politik Sultan Agung"
      1616:
        event: "Lasem ditaklukkan, persekutuan Surabaya-Pajang dikalahkan di Siwalan (Pajang batal kirim suplai)"
      1617:
        event: "Pasuruan sepenuhnya ditaklukkan Mataram"
      1619:
        event: "Tuban ditaklukkan — pendukung utama Surabaya"
        catatan: "Tahun yang sama JP Coen dirikan Batavia"
      1620:
        event: "Serangan pertama ke Surabaya dihambat kapal Belanda Neptunes di Laut Jawa sekitar Gresik"
      1621:
        event: "Gresik dibakar Mataram (terbatas karena ditahan Belanda)"
      1622:
        event: "Sukadana (penyuplai Surabaya) ditaklukkan"
      1623_1624:
        event: "Pengepungan Surabaya gagal karena logistik tidak memadai — pamer kekuatan"
      juli_1624:
        event: "Pertempuran intensif di Madura — Mataram kirim 80.000 prajurit"
      agustus_1624:
        event: "Seluruh Madura takluk — Cakraningrat diangkat (sejak 1678)"
      1625:
        event: "Surabaya takluk setelah pengepungan kelaparan — populasi turun dari 50-60 ribu jadi 1.000. Adipati Jayalengkara jadi vasal Mataram"
        catatan: "Strategi: bendung sungai lewat Mojokerto, kontaminasi air, wabah penyakit"
      1628:
        event: "Serangan pertama Mataram ke Batavia — GAGAL. Dipimpin Tumenggung Baureksa"
      1629:
        event: "Serangan kedua Mataram ke Batavia — GAGAL. Dipimpin Dipati Ukur. JP Coen wafat 1629"
      1630:
        event: "Pemberontakan Tembayat ditumpas Sultan Agung — pemimpin agama dari daerah makam Sunan Bayat"
      1633:
        event: "Sultan Agung ziarah makam Sunan Bayat di Tembayat — islamisasi Mataram. Ubah kalender Saka jadi Anno Javanico (kalender Islam-Jawa)"
      1635:
        event: "Pemberontakan Ukur dan Sumedang ditumpas Mataram (40.000 prajurit) — Priangan kembali tenang 1636"
      1636:
        event: "Penaklukan Giri-Gresik — akhir raja-ulama pesisir. Pangeran Pekik pimpin serangan (keturunan Walisongo, syarat agar pasukan Mataram mau berperang melawan wali)"

    pangeran_pekik:
      sumber: "Kemenbud RI 2025, Jilid 4 Bab 2"
      peran: >
        Putra Jayalengkara (Adipati Surabaya yang takluk 1625). Diambil Sultan
        Agung jadi keluarga Mataram. Dinikahkan dengan Ratu Pandan Sari
        (adik Sultan Agung). Putrinya dinikahkan dengan Amangkurat I (putra
        Sultan Agung, masa depan raja Mataram ke-4).
      strategi_politik: >
        Pemimpin serangan Mataram ke Giri-Gresik 1636 — karena keturunan
        Walisongo (Sunan Ampel Denta), pasukan Mataram mau berperang
        melawan raja-ulama. Pangeran Pekik menjalani kehidupan asketik
        di Ampel yang keramat.
      kontribusi_budaya: >
        Pengarang Serat Jayalengkara Wulang, beberapa suluk, Damarwulan.
        Memperkenalkan budaya pesisir Surabaya yang kosmopolit ke pola
        kultural Mataram di pedalaman. Atas inisiatifnya, naskah Melayu
        tentang cerita Kalila dan Dimna diterjemahkan.
      sumber_primer: "Kemenbud RI 2025, Jilid 4 Bab 2; De Graaf, Puncak Kekuasaan Mataram (1986)"

    aceh_iskandar_muda:
      sumber: "Kemenbud RI 2025, Jilid 4 Bab 2"
      peran_paralel: >
        Sambil Sultan Agung ber ekspansi di Jawa, di Sumatera Sultan Iskandar
        Muda Aceh (1607-1636) juga ber ekspansi: Deli 1612, Aru 1613, Johor
        1613 (serang VOC di Batu Sawar), Pahang 1617, serang Malaka-Portugis
        1615 dan 1629 (gagal besar — 19.000 prajurit tewas). Hubungan Aceh
        dengan Turki Usmani.
      signifikansi: >
        Dua kesultanan Islam Nusantara (Mataram dan Aceh) sezaman ekspansi
        abad 17, sama-sama berhadapan dengan VOC/Portugis. Bisa dijadikan
        drama paralel untuk konteks geopolitik.

    catatan_ekspansi:
      sumber: "Kemenbud RI 2025, Jilid 4 Bab 2"
      narasi_kemenbud: >
        "Nusantara pada abad ke-16 dan ke-17 bukanlah ruang pasif yang
        semata-mata bereaksi terhadap ekspansi Eropa, melainkan sebuah
        lanskap politik yang telah lebih dahulu dihuni oleh kekuatan-
        kekuatan regional dengan kapasitas hegemoni yang nyata. Kesultanan-
        kesultanan Islam besar seperti Aceh, Mataram, dan Gowa-Tallo telah
        membangun sistem kekuasaan yang kompleks dengan memadukan supremasi
        militer, penguasaan ekonomi, legitimasi kultural-keagamaan, serta
        praktik diplomasi lintas kawasan."

  akt_1_founding: >
    1587 M. Sutawijaya menerima takhta Pajang dari Pangeran Benawa.
    Memindahkan pusat ke Kota Gede. Bergelar Panembahan Senapati Khalifatullah
    Sayyidin Panatagama. Era konsolidasi — menaklukkan Jawa Timur, Surabaya.
    Wafat 1601 di Jenar.

  akt_2_golden_age: >
    1613 M. Sultan Agung (Raden Mas Jatmika) naik takhta. Puncak keemasan
    Mataram. Menyatukan hampir seluruh Jawa. Membuat kalender Jawa 1633
    (1 Sura 1555 Jawa = 8 Juli 1633 M = 1 Muharram 1043 H). Dua kali
    menyerang Batavia (1628 dipimpin Tumenggung Baureksa, 1629 dipimpin
    Dipati Ukur) — dua kali gagal karena logistik dan wabah. Sultan Agung
    wafat 1645, dimakamkan di Imogiri.

  akt_3_decline_and_rebellion: >
    Amangkurat I (1645-1677) — tiran, membantai ulama di Alas Gambiran 1646.
    1674-1680: pemberontakan Trunojoyo dari Madura. 1677: Trunojoyo merebut
    Plered. Amangkurat I melarikan diri, wafat di Tegalarum. Amangkurat II
    ("Sunan Amral" — raja Jawa pertama pakai baju Eropa) bersekutu VOC
    menumpas Trunojoyo. Memindahkan ibu kota ke Kartasura. Menampung
    Untung Surapati — Kapten François Tack tewas 1686.

  akt_4_succession_wars: >
    1703-1755. Tiga Perang Suksesi Jawa, dimanipulasi VOC. Perang I (1704-1708):
    Amangkurat III vs Pangeran Puger (Pakubuwana I) — PB I menang dengan VOC,
    Amangkurat III diasingkan ke Ceylon. Perang II (1719-1723). Perang III
    (1749-1757): Pakubuwana II menyerahkan kedaulatan ke VOC 1749. Pemberontakan
    Pangeran Mangkubumi. 1755: Perjanjian Giyanti membelah Mataram menjadi
    Surakarta (Pakubuwana III) dan Yogyakarta (Hamengkubuwana I).

# =============================================================================
# DAFTAR RAJA
# =============================================================================
kings_list:
  source_primary: "Babad Tanah Jawi + arsip VOC + H.J. de Graaf & Pigeaud"
  note: >
    11 raja Mataram Islam (dari Senapati hingga Hamengkubuwana I).
    Setelah Giyanti 1755, garis terbelah menjadi Surakarta dan Yogyakarta.
  kings:
    - number: 1
      name: "Panembahan Senapati"
      alt_name: "Danang Sutawijaya"
      reign: "1587–1601 M"
      note: "Pendiri Mataram Islam. Wafat di Jenar 1601."
    - number: 2
      name: "Panembahan Hanyokrowati"
      alt_name: "Seda ing Krapyak"
      reign: "1601–1613 M"
      note: "Putra Senapati. Ayah Sultan Agung."
    - number: 3
      name: "Sultan Agung Hanyokrokusumo"
      alt_names: ["Raden Mas Jatmika", "Raden Mas Rangsang"]
      reign: "1613–1645 M"
      note: "Raja terbesar. Lahir 1593 di Kotagede. Kalender Jawa 1633. Serangan Batavia 1628-1629. Wafat 1645, dimakamkan di Imogiri."
    - number: 4
      name: "Amangkurat I"
      alt_name: "Sunan Tegalarum"
      reign: "1645–1677 M"
      note: "Tiran. Membantai ulama (Alas Gambiran 1646). Memindahkan ibu kota ke Plered. Tewas dalam pelarian dari Trunojoyo."
    - number: 5
      name: "Amangkurat II"
      alt_name: "Sunan Amral"
      reign: "1680–1703 M"
      note: "Dijuluki 'Sunan Amral' (Admiral) karena pakai baju Eropa. Bersekutu VOC. Menampung Untung Surapati. Memindahkan ibu kota ke Kartasura."
    - number: 6
      name: "Amangkurat III"
      reign: "1703–1708 M"
      note: "Perang Suksesi Jawa I vs Pangeran Puger. Kalah, diasingkan ke Ceylon."
    - number: 7
      name: "Pakubuwana I"
      alt_name: "Pangeran Puger"
      reign: "1704–1719 M"
      note: "Adik Amangkurat II. Naik takhta dengan dukungan VOC. Leluhur semua raja Surakarta-Yogyakarta."
    - number: 8
      name: "Amangkurat IV"
      reign: "1719–1726 M"
      note: "Periode singkat, konflik internal."
    - number: 9
      name: "Pakubuwana II"
      reign: "1726–1749 M"
      note: "Memindahkan keraton ke Surakarta (1745). Menyerahkan kedaulatan ke VOC (1749)."
    - number: 10
      name: "Pakubuwana III"
      reign: "1749–1788 M"
      note: "Sultan terakhir Mataram unified, lalu sultan pertama Surakarta setelah Giyanti 1755."
    - number: 11
      name: "Hamengkubuwana I"
      alt_name: "Pangeran Mangkubumi"
      reign: "1755–1792 M"
      note: "Pendiri Kesultanan Yogyakarta. Lahir 5 Agustus 1717."
  parallel_figures:
    - name: "Trunojoyo"
      period: "1674–1680 M"
      role: "Pemberontak Madura yang hampir menghancurkan Mataram. Merebut Plered 1677. Dikalahkan VOC-Amangkurat II. Dieksekusi 1680."
      source: "Babad Tanah Jawi, arsip VOC"
    - name: "Untung Surapati"
      period: "1660–1706 M"
      role: "Pahlawan anti-VOC. Lahir di Gelgel, Bali. Budak VOC yang memberontak. Ditampung Amangkurat II (1685). Kapten François Tack tewas di Kartasura (1686). Menjadi bupati Pasuruan. Tewas 1706 melawan aliansi VOC-Pakubuwana I."
      source: "Babad Tanah Jawi, arsip VOC, Babad Untung Surapati"
    - name: "Raden Mas Said / Pangeran Sambernyawa"
      period: "1749–1757 M"
      role: "Pendiri Mangkunagaran. Putra Pangeran Arya Mangkunegara. Awalnya bersekutu dengan Pangeran Mangkubumi, lalu merasa dikhianati setelah Giyanti 1755. Perjanjian Salatiga 1757 — mendapat Mangkunagaran."
      source: "Babad Tanah Jawi, Perjanjian Salatiga 1757"
    - name: "Pangeran Puger / Pakubuwana I"
      period: "1704–1719 M"
      role: "Adik Amangkurat II. Naik takhta dengan dukungan VOC dalam Perang Suksesi I. Leluhur semua raja Surakarta-Yogyakarta."
      source: "Babad Tanah Jawi, arsip VOC"
    - name: "Amangkurat III"
      period: "1703–1708 M"
      role: "Putra Amangkurat II. Kalah dalam Perang Suksesi I melawan Pangeran Puger (Pakubuwana I). Diasingkan ke Ceylon, wafat 1734."
      source: "Babad Tanah Jawi, arsip VOC"
    - name: "Amangkurat IV"
      period: "1719–1726 M"
      role: "Putra Pakubuwana I. Perang Suksesi II melawan adik-adiknya (Pangeran Blitar, Pangeran Purbaya). Menang dengan VOC."
      source: "Babad Tanah Jawi, arsip VOC"

# =============================================================================
# 3 PERANG SUKSESI JAWA
# =============================================================================
succession_wars:
  note: >
    Tiga Perang Suksesi Jawa (1704-1757) yang dimanipulasi VOC untuk melemahkan
    Mataram dan menguasai wilayahnya. Berakhir dengan pembagian Mataram menjadi
    Surakarta, Yogyakarta, dan Mangkunagaran.
  wars:
    - name: "Perang Suksesi Jawa I"
      period: "1704–1708 M"
      conflict: "Amangkurat III (raja sah) vs Pangeran Puger (Pakubuwana I)"
      cause: "Amangkurat III dianggap lemah dan zalim. Pangeran Puger mengklaim takhta dengan dukungan VOC."
      allies_amangkurat_iii: ["Untung Surapati (atau anak-anaknya setelah Surapati wafat 1706)"]
      allies_puger: ["VOC"]
      result: "Pangeran Puger menang, menjadi Pakubuwana I. Amangkurat III diasingkan ke Ceylon, wafat 1734."
      consequences:
        - "Mataram menyerahkan Priangan (Jawa Barat), Madura, Semarang kepada VOC"
        - "Cirebon menjadi protektorat VOC"
        - "Mataram kehilangan kedaulatan penuh"
      source: "Babad Tanah Jawi, arsip VOC"
    - name: "Perang Suksesi Jawa II"
      period: "1719–1723 M"
      conflict: "Amangkurat IV vs adik-adiknya (Pangeran Blitar, Pangeran Purbaya)"
      cause: "Amangkurat IV naik takhta 1719. Adik-adiknya menolak dan memberontak."
      allies_amangkurat_iv: ["VOC"]
      allies_rebels: ["Pemimpin Islam", "Rakyat"]
      result: "Amangkurat IV menang dengan bantuan VOC. Pangeran Blitar dan Purbaya diasingkan."
      consequences:
        - "VOC semakin dalam mencengkeram Mataram"
      source: "Babad Tanah Jawi, arsip VOC"
    - name: "Perang Suksesi Jawa III"
      period: "1749–1757 M"
      conflict: "Pakubuwana III vs Pangeran Mangkubumi vs Raden Mas Said (Pangeran Sambernyawa)"
      cause: "Pakubuwana II menyerahkan kedaulatan Mataram ke VOC 1749. Banyak pangeran dan rakyat menolak."
      key_figures:
        - name: "Pangeran Mangkubumi"
          role: "Paman PB III, memberontak melawan VOC. Kemudian menjadi Hamengkubuwana I."
        - name: "Raden Mas Said / Pangeran Sambernyawa"
          role: "Awalnya bersekutu dengan Mangkubumi, lalu merasa dikhianati setelah Giyanti 1755."
      treaties:
        - name: "Perjanjian Giyanti"
          date: "13 Februari 1755"
          result: "Mataram dibagi menjadi Kasunanan Surakarta (PB III) dan Kasultanan Yogyakarta (Hamengkubuwana I)."
        - name: "Perjanjian Salatiga"
          date: "1757"
          result: "Raden Mas Said mendapat Mangkunagaran."
      consequences:
        - "Mataram terbagi menjadi TIGA negara: Surakarta, Yogyakarta, Mangkunagaran"
        - "Kemudian 1813 dibentuk Pakualaman — menjadi EMPAT keraton"
      source: "Babad Tanah Jawi, Perjanjian Giyanti, Perjanjian Salatiga"

# =============================================================================
# EMPAT KERATON PASCA-PERPECAHAN
# =============================================================================
four_keratons:
  note: >
    Setelah Perang Suksesi III, Mataram terbagi menjadi empat pusat kekuasaan
    yang masih ada hingga kini. Sistem Catur Sagotra — empat garis keturunan
    dari satu leluhur (Sultan Agung / Ki Ageng Pemanahan).
  keratons:
    - name: "Kasunanan Surakarta"
      founded: "1745/1755"
      founder: "Pakubuwana III"
      title: "Susuhunan (Sunan)"
      territory: "Surakarta dan sekitarnya"
      color: "Hitam"
      note: "Penerus garis utama Mataram. Keraton di Surakarta."
    - name: "Kasultanan Yogyakarta"
      founded: "1755"
      founder: "Hamengkubuwana I (Pangeran Mangkubumi)"
      title: "Sultan"
      territory: "Yogyakarta dan sekitarnya"
      color: "Hijau"
      note: "Didirikan setelah Perjanjian Giyanti. Keraton di Yogyakarta."
    - name: "Mangkunagaran"
      founded: "1757"
      founder: "Raden Mas Said (Pangeran Sambernyawa)"
      title: "Pangeran Adipati"
      territory: "Enklave di Surakarta"
      color: "Merah marun"
      note: "Didirikan setelah Perjanjian Salatiga. Pangeran kecil di dalam wilayah Surakarta."
    - name: "Pakualaman"
      founded: "1813"
      founder: "Pangeran Notokusumo (putra Hamengkubuwana I)"
      title: "Pangeran Adipati"
      territory: "Enklave di Yogyakarta"
      color: "Biru dongker"
      note: "Didirikan era Daendels. Pangeran kecil di dalam wilayah Yogyakarta."

