# =============================================================================
# KERAJAAN PRA-MATARAM (sebelum 732 M) — Konteks Latar Sejarah
# =============================================================================
predecessor_kingdoms:
  deskripsi: >
    Sebelum Sanjaya mendirikan Wangsa Sanjaya di Bukit Sthirengga (732 M),
    Nusantara sudah dihuni oleh kerajaan-kerajaan Hindu-Buddha yang lebih tua.
    Kerajaan-kerajaan ini adalah konteks sejarah yang membentuk Mataram Kuno —
    baik secara kultural (sinkretisme Siwa-Buddha), politik (warisan takhta),
    maupun ekonomi (jaringan dagang maritim). Pemahaman mereka penting untuk
    drama yang menelusuri akar Mataram ke peradaban sebelumnya.


  kutai_martadipura:
    nama: "Kutai Martadipura / Kutai Kertanegara (fase awal)"
    periode: "Abad 4-5 M (~ 300-450 M)"
    lokasi: "Muara Kaman, tepi Sungai Mahakam, Kalimantan Timur"
    agama: "Hindu Siwa"
    sumber_primer:
      - "7 Prasasti Yupa (tiang kurban batu) — ditemukan di Muara Kaman"
      - "Aksara Pallawa Awal, bahasa Sanskerta"
    raja-raja:
      - "Kudungga — pendiri awal (nama Indonesia asli, belum sepenuhnya Hindu)"
      - "Aswawarman — putra Kudungga, dianggap 'wamsakarta' (pendiri wangsa)"
      - "Mulawarman — raja terbesar, melakukan Vratyastoma (upacara penyucian)"
    signifikansi: >
      Kerajaan Hindu tertua di Indonesia (dan Nusantara). Bukti bahwa proses
      Hinduisasi sudah terjadi di Kalimantan abad ke-4, sebelum Jawa. Hubungan
      dengan Mataram Kuno: warisan kultural Hindu Siwa, model prasasti Pallawa
      yang kemudian dipakai di Canggal (732 M) — tetapi tidak ada hubungan politik
      langsung.
    drama_potensial: >
      Karakter Mulawarman yang melakukan upacara Vratyastoma — simbol transisi
      dari kepercayaan animis ke Hindu. Kutai sebagai "bangsa laut" yang menjadi
      jembatan budaya India-Nusantara.

  tarumanagara:
    nama: "Tarumanagara"
    periode: "358-669 M (311 tahun)"
    lokasi: "Jawa Barat (Bogor, Bekasi, Karawang, Cirebon — pesisir Citarum)"
    agama: "Hindu Wișnu (Surya/Wișnu)"
    sumber_primer:
      - "Prasasti Tugu (abad 5) — terpanjang di Tarumanagara, gali saluran air"
      - "Prasasti Kebon Kopi (abad 5) — sepasang tapak kaki Gajah Airawata"
      - "Prasasti Ciaruteun (abad 5) — tapak kaki Raja Purnawarman"
      - "Prasasti Jambu (abad 5) — sepasang tapak kaki Purnawarman"
      - "Prasasti Lebak (Banten) — tapak kaki Purnawarman"
      - "Prasasti Pasir Awi — nama Prabu Kian Santang (legenda Sunda)"
      - "Berita Cina Dinasti Tang dan Song — 'Tolomo' / 'Duohuomo'"
    raja-raja:
      - "Jayasingawarman (358-382) — pendiri, dari India (Salankayana)?"
      - "Dharmayawarman (382-395)"
      - "Purnawarman (395-434) — raja terbesar, gali saluran Gomati & Candrabaga"
      - "Wisnuwarman (434-455)"
      - "Indrawarman (455-515)"
      - "Candrawarman (515-535)"
      - "Suryawarman (535-561) — perluasan ke Tanjung Sembiran"
      - "Kertawarman (561-628)"
      - "Sudhawarman (628-639)"
      - "Hariwangsa (639-640)"
      - "Linggawarman (640-666) — raja terakhir Tarumanagara bersatu"
    signifikansi: >
      Kerajaan Hindu tertua di Jawa. Saluran air Gomati-Candrabaga adalah
      proyek teknik hidrologis pertama di Nusantara (5 km panjang). Hubungan
      dengan Mataram Kuno: Prasasti Canggal (732 M) Sanjaya menyebut dirinya
      "cicit Maharani Shima dari Kalingga" — garis keturunan kerajaan
      pesisir utara Jawa yang berakar dari Tarumanagara. Pasca-runtuh 669,
      Tarumanagara terpecah: Sunda (Tarusbawa, 670) + Galuh (Wretikandayun, 612).
    drama_potensial: >
      Karakter Purnawarman — raja-insinyur yang menggali saluran air untuk
      rakyatnya. Pertentangan Sunda vs Galuh setelah pecah (670).

  kalingga_holing:
    nama: "Kalingga / Holing / Heling"
    periode: "Abad 6-7 M (~ 500-680 M)"
    lokasi: "Pesisir utara Jawa Tengah — diperdebatkan: Jepara, Pekalongan, Pemalang"
    agama: "Hindu-Buddha (sinkretis)"
    sumber_primer:
      - "Berita Cina Dinasti Tang — 'Heling' atau 'Dvapanta'"
      - "Catatan I-Tsing (664-689 M) — kunjungan ke Holing"
      - "Catatan Huining (Hui-ning) — pendeta Buddha Cina yang tinggal 3 tahun di Holing (664-667 M)"
      - "Carita Parahyangan (abad 16) — menyebut Maharani Shima"
    raja-raja:
      - "Ratu Shima (abad 7, ~ 674-680) — ratu paling terkenal, hukum keras"
      - "Santanu (632-648 M) — Prabhu Kirathasingha, putra Ratu Shima"
      - "Ratu Shima (permaisuri) → 680-an M"
    signifikansi: >
      Kalingga adalah jembatan antara Tarumanagara (Hindu) dan Sriwijaya-Mataram
      (Buddha). I-Tsing (671 M) menyebutkan Holing sebagai tempat persinggahan
      untuk belajar Sanskerta sebelum ke India. Hubungan dengan Mataram Kuno:
      Sanjaya dalam Prasasti Canggal (732 M) menyebut dirinya sebagai "cicit
      Maharani Shima dari Kalingga" — menjadikan Kalingga sebagai leluhur
      dinasti Wangsa Sanjaya. Jadi Mataram Kuno adalah pewaris politik Kalingga.
    drama_potensial: >
      Karakter Ratu Shima — ratu yang adil tetapi keras, menghukum putranya
      sendiri karena menyentuh uang emas di jalan (legenda terkenal).
      Karakter Huining — pendeta Buddha Cina yang tinggal di Holing, mengajari
      Jnanabhadra (pendeta lokal).

  kanjuruhan:
    nama: "Kanjuruhan"
    periode: "Abad 8 (760 M, atau lebih awal)"
    lokasi: "Malang, Jawa Timur — Desa Dinoyo, Kecamatan Merjosari"
    agama: "Hindu Siwa"
    sumber_primer:
      - "Prasasti Dinoyo (760 M) — ditemukan di Desa Dinoyo, Malang"
      - "Aksara Jawa Kuno, bahasa Sanskerta"
    raja-raja:
      - "Dewasimha (sebelum 760) — raja awal"
      - "Gajayana (760 M) — putra Dewasimha, menggantikan ayah"
    signifikansi: >
      Kerajaan Hindu kecil di Jawa Timur sezaman dengan awal Mataram Kuno
      (Sanjaya 732 M). Tidak ada bukti langsung hubungan politik dengan
      Mataram Kuno, tetapi keberadaannya menunjukkan bahwa "Jawa Timur" sebagai
      pusat politik sudah muncul abad ke-8 — 200 tahun sebelum Mpu Sindok
      memindahkan Mataram ke Jawa Timur (929 M). Mungkin Kanjuruhan adalah
      pendahulu lokal yang menyiapkan tanah bagi pindahnya Mataram ke timur.
    drama_potensial: >
      Karakter Gajayana — raja lokal Jawa Timur yang membangun candi Agastya
      (Dinoyo), sezaman dengan Sanjaya di Jawa Tengah. Dua pusat Hindu di
      Jawa: Mataram Kuno (Sanjaya) di barat, Kanjuruhan (Gajayana) di timur.

  sunda_galuh:
    nama: "Kerajaan Sunda & Galuh (twin kingdoms)"
    periode: "670-1579 M (909 tahun — melampaui Mataram Kuno)"
    lokasi: "Jawa Barat — Sunda: Bogor/Pakuan; Galuh: Ciamis/Kawali"
    agama: "Hindu Wișnu → Hindu-Siwa sinkretis"
    sumber_primer:
      - "Carita Parahyangan (abad 16) — naskah Sunda kuno"
      - "Prasasti Kebon Kopi II (942 M) — raja Sunda"
      - "Prasasti Huludayeuh (1030 M)"
      - "Prasasti Cibadak (1030 M) — raja Sri Jayabupati"
      - "Prasasti Batutulis (Pakuan, 1533 M) — Prabu Surawisesa"
      - "Catatan Tome Pires 'Suma Oriental' (1515)"
    raja-raja_kunci:
      - "Tarusbawa (670-723) — pendiri Sunda, perpecahan dari Tarumanagara"
      - "Wretikandayun (612-702) — pendiri Galuh"
      - "Sanjaya (723-732) — raja Sunda yang pindah ke Mataram (jadi pendiri Wangsa Sanjaya)"
      - "Rakeyan Jamri (723-732) — raja Sunda pertama (putra Sanjaya)"
      - "Sri Jayabupati (1030-1042) — raja Sunda abad 11"
    signifikansi: >
      Sanjaya (pendiri Wangsa Sanjaya Mataram Kuno) berasal dari Sunda —
      putra Ratu Sena / Sanaha dari Sunda yang menikah dengan Bratasenava
      (raja Galuh). Sanjaya naik takhta Sunda 723, lalu mendirikan lingga
      di Bukit Sthirengga (732) — menandai kelahiran Mataram Kuno. Hubungan
      dengan Mataram Kuno: SANJAYA ADALAH RAJA SUNDA YANG MEMBANGUN MATARAM.
      Inilah jembatan langsung antara Tarumanagara-Kalingga-Sunda-Mataram.
    drama_potensial: >
      Karakter Sanjaya — pangeran Sunda yang naik takhta kerajaan ibu
      (Sunda) dan ayah (Galuh), lalu membangun Mataram di Jawa Tengah.
      Tokoh yang menghubungkan tiga kerajaan: Sunda, Galuh, Mataram.

  sriwijaya_early:
    nama: "Sriwijaya (fase awal)"
    periode: "670-1025 M (355 tahun — sezaman dengan Mataram Kuno)"
    lokasi: "Palembang, Sumatera Selatan — pesisir Sungai Musi"
    agama: "Buddha Mahayana (terutama Buddha Vajrayana abad 8-9)"
    sumber_primer:
      - "Prasasti Kedukan Bukit (682 M) — Dapunta Hyang Sri Jayanasa, pendiri"
      - "Prasasti Talang Tuwo (684 M) — taman Sriwijaya"
      - "Prasasti Telaga Batu (abad 7)"
      - "Prasasti Kota Kapur (686 M) — penaklukan Bangka"
      - "Prasasti Karang Berahi (7th c.) — penaklukan Jambi"
      - "Catatan I-Tsing (671 M, 685-689 M) — 'more than 1000 Buddhist priests'"
      - "Prasasti Nalanda (860 M) — Balaputradewa di India"
      - "Prasasti Ligor (775 M) — Sriwijaya di Semenanjung Malaka"
      - "Berita Cina: Sanfoqi (Sumatra+Palembang)"
    raja-raja_kunci:
      - "Dapunta Hyang Sri Jayanasa (682-702) — pendiri"
      - "Dharmasetu (awal abad 8) — ekspansi ke Malaka"
      - "Visnuwarman (gen. awal)"
      - "Indrawarman"
      - "Rudravarman"
      - "Samaragrawira (awal abad 9) — ayah Balaputradewa"
      - "Samaratungga (abad 9, ~812-833) — puncak Sriwijaya-Syailendra"
      - "Balaputradewa (860-an) — pangeran Syailendra lari ke Sriwijaya"
      - "Sri Udayadityavarman (960-962)"
      - "Sri Cudamani Warmadewa (988-1003)"
      - "Sri Maravijayottunggavarman (1008-1017)"
      - "Sangrama Vijayatunggavarman (1017-1025) — ditawan Chola"
    signifikansi: >
      Sriwijaya adalah kekuatan maritim Buddha sezaman dengan Mataram Kuno.
      Hubungan paling kompleks: keluarga Syailendra di Mataram punya cabang di
      Sriwijaya. Samaratungga (Sriwijaya-Syailendra) membangun Borobudur di
      Jawa, lalu putranya Balaputradewa kalah saing dengan Pramodawardhani-
      Rakai Pikatan → lari ke Sriwijaya (856, Prasasti Nalanda 860).
      Sriwijaya-Mataram adalah dua kutub Buddha-Hindu di Nusantara abad 8-11.
      Pasca-Pralaya Mataram (1016), Sriwijaya juga diserang Chola (1025) —
      dua kerajaan besar Nusantara runtuh dalam 9 tahun.
    drama_potensial: >
      Karakter Balaputradewa — pangeran Syailendra yang diusir dari Mataram,
      lari ke Sriwijaya, membangun kembali kekuasaan di Palembang. Hubungan
      dendam keluarga Mataram-Sriwijaya selama 3 generasi.

# =============================================================================
# KERAJAAN SEZAMAN MATARAM KUNO (732-1016 M)
# =============================================================================
contemporaneous_kingdoms:
  deskripsi: >
    Selama 284 tahun Mataram Kuno berdiri (732-1016), beberapa kerajaan
    sezaman ada di Nusantara dan Asia Tenggara. Hubungan mereka dengan
    Mataram bervariasi: ada yang bersekutu (pernikahan), bermusuhan (perang),
    atau saling menghormati (diplomasi-agama). Berikut kerajaan-kerajaan
    yang sezaman:

  sriwijaya:
    nama: "Sriwijaya"
    periode: "670-1025 M (puncak); 670-1183 (menghilang perlahan)"
    lokasi: "Palembang, Sumatera Selatan — pesisir Sungai Musi"
    ibu_kota: "Palembang"
    agama: "Buddha Mahayana → Vajrayana"
    status_hubungan_dengan_mataram: "Kompleks — keluarga, saingan, dan akhirnya sekutu melawan Chola"
    raja-raja_kunci:
      - "Dapunta Hyang Sri Jayanasa (682-702) — pendiri"
      - "Dharmasetu (awal abad 8) — ekspansi ke Malaka"
      - "Samaragrawira (awal abad 9) — ayah Balaputradewa"
      - "Samaratungga (~812-833) — puncak, selesai Borobudur"
      - "Balaputradewa (856-880-an) — pangeran lari dari Mataram"
      - "Sri Udayadityavarman (960-962)"
      - "Sri Cudamani Warmadewa (988-1003)"
      - "Sangrama Vijayatunggavarman (1017-1025) — ditawan Chola"
    hubungan_mataram:
      - "Periode awal (abad 7-8): Hubungan damai — Sriwijaya sebagai pusat Buddha, Mataram Hindu awal"
      - "Periode Syailendra (770-856): Keluarga Syailendra memerintah di KEDUA kerajaan — Samaratungga di Mataram, ayahnya di Sriwijaya"
      - "Periode perpecahan (856): Balaputradewa (Syailendra) kalah dari Pramodawardhani-Pikatan → lari ke Sriwijaya → hubungan tegang"
      - "Periode rapprochement (abad 10): Hubungan normal kembali — utusan Sriwijaya-Mataram ke Cina bersamaan"
      - "Pralaya berdekatan: Mataram jatuh 1016, Sriwijaya diserang Chola 1025"
    interaksi_budaya:
      - "Borobudur (Jawa, ~825 M) dibangun oleh Samaratungga (Syailendra-Mataram) — pengaruh Buddha Sriwijaya di Jawa"
      - "Prasasti Nalanda (860 M) di India — menyebut Balaputradewa sebagai 'raja Srivijaya' dari garis Syailendra"
      - "I-Tsing belajar Sanskerta 6 bulan di Sriwijaya 671 M sebelum ke Nalanda India — Sriwijaya sebagai 'jembatan Buddha' Cina-India"
      - "Pertukaran pendeta Buddha: pendeta Sriwijaya mengajar di Mataram, sebaliknya"

  melayu_kingdom:
    nama: "Kerajaan Melayu / Malayu"
    periode: "Abad 7-13 M (sebelum dan sesudah Mataram)"
    lokasi: "Jambi, pesisir Sungai Batanghari, Sumatera Timur"
    agama: "Hindu-Buddha"
    sumber_primer:
      - "Prasasti Kedukan Bukit (682 M) — Dapunta Hyang menaklukkan Melayu"
      - "Catatan I-Tsing — Melayu sebagai kerajaan terpisah dari Sriwijaya"
      - "Candi Muara Jambi (abad 9-12) — kompleks candi Buddha terbesar di Sumatera"
    status: >
      Melayu awalnya kerajaan merdeka abad 7, ditaklukkan Sriwijaya 682.
      Tumbuh kembali abad 11-13 setelah Sriwijaya melemah (pasca-Chola).
      Dharmasraya (abad 13) adalah penerus Melayu — yang nantinya mengirim
      tribut ke Majapahit (Nagarakretagama menyebut Melayu sebagai bawahan
      Majapahit 1365).
    hubungan_mataram: >
      Tidak ada hubungan langsung yang tercatat. Hubungannya tidak langsung
      lewat Sriwijaya: Melayu sebagai bawahan Sriwijaya → ikut siklus
      naik-turun Sriwijaya-Mataram.

  bali_warmadewa:
    nama: "Bali (Wangsa Warmadewa)"
    periode: "914-1296 M (382 tahun — melampaui Mataram Kuno)"
    lokasi: "Bali — pelembangan Bedulu (Gianyar), Sanur, Pejeng"
    agama: "Hindu Siwa-Buddha sinkretis"
    sumber_primer:
      - "Prasasti Blanjong (914 M) — Sanur, dua bahasa (Sanskerta + Bali Kuno)"
      - "Prasasti Sukawana (882 M) — Sri Kesari"
      - "Prasasti Penempahan, Malat Gede, Pukuh — paralel Blanjong"
      - "Prasasti Sembiran (922 M, 975 M, 1026 M) — komunitas pedagang印度"
      - "Prasasti Bebetin (896 M, 913 M)"
    raja-raja_kunci:
      - "Sri Kesari Warmadewa (~882-914) — pendiri wangsa, kemenangan militer di Gurun dan Suwal"
      - "Sri Ugrasena (~915-942) — ratu/adm. besar, hubungan erat dengan Mataram"
      - "Tabanendra Warmadewa (955-967)"
      - "Janasadhu Warmadewa (975-980)"
      - "Sri Wijaya Mahadewi (980-991) — ratu perempuan"
      - "Dharmodayana Warmadewa (991-1011) — menikahi putri Airlangga?"
      - "Airlangga (1011-1042) — raja Bali sekaligus raja Kahuripan"
    hubungan_mataram: >
      Bali adalah saudara selatan Mataram. Airlangga (pendiri Kahuripan,
      peradaban pasca-Mataram) adalah putra raja Bali (Dharmodayana Warmadewa)
      dan putri raja Mataram (Mahendradatta/Sri Isyanatunggadewi). Pasca
      Pralaya 1016, Airlangga lari ke Bali dulu, lalu kembali ke Jawa Timur
      membangun Kahuripan. Hubungan Mataram-Bali adalah hubungan keluarga
      langsung lewat pernikahan dinasti.

  chola_kingdom:
    nama: "Chola Empire (India Selatan)"
    periode: "848-1279 M (431 tahun)"
    lokasi: "Tamil Nadu, India Selatan — Thanjavur, Gangaikonda Cholapuram"
    agama: "Hindu Siwa"
    raja_kunci: "Rajendra Chola I (1014-1044) — penyerang Sriwijaya 1025"
    signifikansi: >
      Chola bukan kerajaan Nusantara, tetapi MEREKA PENYEBAB RUNTUHNYA
      SRIWIJAYA (1025) — 9 tahun setelah Pralaya Mataram (1016). Dalam
      9 tahun, dua kerajaan besar Nusantara (Mataram + Sriwijaya) runtuh
      hampir bersamaan: Mataram oleh Wurawari, Sriwijaya oleh Chola.
      Konsekuensi: lahirlah Kahuripan (Airlangga 1019-1042) di Jawa dan
      runtuhnya hegemoni Buddha di Asia Tenggara.
    hubungan_mataram: >
      Tidak ada kontak langsung yang tercatat. Tetapi: Airlangga (raja
      Mataram penerus) menikahi putri Sriwijaya (Dharmaprasadottungadevi)
      yang lari dari serangan Chola 1025 → hubungan politik Mataram-Sriwijaya-
      Chola terjalin dalam 1 generasi.

  champa:
    nama: "Champa (Campa)"
    periode: "192-1832 M (1640 tahun — kerajaan terlama Asia Tenggara)"
    lokasi: "Vietnam Tengah-Selatan — Indrapura, Vijaya, Panduranga"
    agama: "Hindu Siwa (Bhadresvara) → Buddha"
    sumber_primer: "Prasasti Cam, Aksara Cam-Sanskerta"
    raja_kunci_abad_8_11:
      - "Prithindravarman (abad 8 awal)"
      - "Satyavarman (770-787)"
      - "Indravarman I (787-801)"
      - "Harivarman I (803-817)"
      - "Vikrantavarman III (abd. 9)"
      - "Indravarman II (918-959)"
      - "Jaya Simhavarman I (ab. 10)"
      - "Harivarman III (1008-1044) — sezaman dengan Airlangga"
    signifikansi: >
      Champa adalah kerajaan Hindu sezaman yang punya banyak kesamaan dengan
      Mataram: Hindu Siwa, prasasti Sanskerta, aksara Pallawa, candi batu
      (My Son), relief Ramayana. Hubungan tidak langsung lewat jaringan
      dagang maritim Laut Cina Selatan. Tidak ada bukti kontak politik
      langsung Mataram-Champa, tetapi keduanya adalah bagian dari "mandala
      Hindu Asia Tenggara" abad 8-11.
    drama_potensial: >
      Visual: pedagang Champa di pelabuhan Jawa, candi My Son dengan
      kemiripan struktural ke Prambanan, aksara Pallawa yang sama.

  khmer_empire:
    nama: "Khmer Empire / Kamboja Kuno"
    periode: "802-1431 M (629 tahun)"
    lokasi: "Kamboja — Hariharalaya, Yasodharapura (Angkor)"
    agama: "Hindu Siwa (Devaraja) → Buddha Theravada (akhir)"
    raja-raja_kunci:
      - "Jayavarman II (802-835) — pendiri Khmer Empire, 'chakravartin'"
      - "Indravarman I (877-889) — pembangun Bakong dan Preah Ko"
      - "Yasovarman I (889-915) — pendiri Yasodharapura (Angkor pertama)"
      - "Rajendravarman II (944-968)"
      - "Jayavarman V (968-1001)"
      - "Suryavarman I (1006-1050) — sezaman Airlangga, minta bantuan Chola"
    signifikansi: >
      Khmer adalah kerajaan Hindu terbesar di daratan Asia Tenggara
      sezaman dengan Mataram Kuno. Hubungan tidak langsung: Suryavarman I
      minta bantuan Rajendra Chola I melawan Tambralinga (bawahan Sriwijaya)
      → memicu serangan Chola ke Sriwijaya 1025 → melemahkan Sriwijaya →
      Airlangga menikahi putri Sriwijaya → jaringan politik Asia Tenggara
      abad 11 saling terkait. Angkor Wat dibangun 1113-1150 — sezaman dengan
      puncak Singasari-Majapahit awal.
    drama_potensial: >
      Visual: Khmer envoy di istana Mataram, pertukaran arsitek candi
      (Prambanan & Angkor Wat dibangun hampir bersamaan).

# =============================================================================
# HUBUNGAN ANTAR-KERAJAAN — Diplomasi, Perang, Pernikahan, Agama
# =============================================================================
inter_kingdom_relations:
  deskripsi: >
    Mataram Kuno bukan kerajaan terisolasi. Selama 284 tahun, mereka berinteraksi
    dengan kerajaan-kerajaan sezaman dalam 4 mode: (1) diplomasi (utusan ke
    Cina, India), (2) perang (pernikahan-perebutan takhta dengan kerajaan
    Nusantara), (3) pernikahan dinasti (Mataram-Bali, Mataram-Sriwijaya,
    Mataram-Sunda), (4) pertukaran agama-budaya (pendeta Buddha Sriwijaya-
    Mataram, pendeta Hindu Champa-Mataram). Berikut 10 hubungan terdokumentasi:

  hubungan_1_sanjaya_sunda_kalingga:
    jenis: "Pernikahan dinasti + warisan takhta"
    periode: "± 700-732 M"
    pihak: "Sanjaya (Mataram-Sunda) ↔ Kalingga"
    narasi: >
      Sanjaya adalah putra Ratu Sena/Sanaha (putri Maharani Shima dari
      Kalingga) dengan Bratasenava (raja Galuh). Sanjaya mewarisi takhta
      Sunda (723) dan takhta Kalingga (lewat ibu), lalu mendirikan lingga
      di Bukit Sthirengga (732 M) — menandai kelahiran Mataram Kuno.
      INI ADALAH HUBUNGAN LINTAS-TIGA-KERAJAAN: Sunda + Galuh + Kalingga
      menyatu dalam diri Sanjaya. Prasasti Canggal (732 M) menyebut Sanjaya
      sebagai "cicit Maharani Shima dari Kalingga".
    sumber: "Prasasti Canggal (732 M), Carita Parahyangan (abad 16)"

  hubungan_2_syailendra_mataram_sriwijaya:
    jenis: "Keluarga dinasti lintas-kerajaan"
    periode: "± 780-860 M (3 generasi)"
    pihak: "Wangsa Syailendra di Mataram ↔ Sriwijaya"
    narasi: >
      Wangsa Syailendra di Mataram (Dapunta Selendra → Samaratungga →
      Balaputradewa) memiliki hubungan keluarga dengan raja-raja Sriwijaya.
      Samaratungga (pembangun Borobudur) disebut dalam Prasasti Nalanda
      (860 M) sebagai keturunan raja Sriwijaya. Teori: ayah Samaratungga
      (Samaragrawira) adalah raja Sriwijaya yang mengirim putranya ke Jawa
      untuk menikah dengan keluarga Sanjaya → melahirkan garis Syailendra
      di Mataram. Setelah Balaputradewa kalah dari Pramodawardhani-Rakai
      Pikatan dalam perang saudara (856 M), ia lari ke Sriwijaya dan menjadi
      raja di sana — Prasasti Nalanda (860 M) di India mencatat ini.
    sumber: "Prasasti Nalanda (860 M), Prasasti Siwagrha/Wantil (856 M)"

  hubungan_3_mataram_bali_warmadewa:
    jenis: "Pernikahan dinasti + sekutu politik"
    periode: "± 960-1016 M"
    pihak: "Mataram (Wangsa Isyana) ↔ Bali (Wangsa Warmadewa)"
    narasi: >
      Mpu Sindok (pendiri Wangsa Isyana, 929 M) menikahkan putrinya,
      Sri Isyanatunggadewi (Mahendradatta), dengan raja Bali Dharmodayana
      Warmadewa. Putra mereka adalah Airlangga (lahir ~990 M). Ketika
      Pralaya 1016 terjadi, Airlangga (16 tahun) lari ke hutan + ke Bali,
      lalu kembali ke Jawa Timur (1019) untuk membangun Kahuripan.
      INI ADALAH HUBUNGAN MATARAM-BALI PALING KUAT: Airlangga adalah pangeran
      Bali-Mataram yang mewarisi kedua takhta.
    sumber: "Prasasti Pucangan/Calcutta (~1041 M), Prasasti Sembiran (Bali 1016 M)"

  hubungan_4_mataram_sriwijaya_chola:
    jenis: "Sekutu politik melalui pernikahan pasca-bencana"
    periode: "± 1016-1035 M"
    pihak: "Mataram (Airlangga) ↔ Sriwijaya (putri raja) ↔ Chola (penyerang)"
    narasi: >
      Pasca-Pralaya 1016, Sriwijaya diserang Chola (Rajendra I, 1025).
      Sangrama Vijayatunggavarman (raja Sriwijaya) ditawan. Putrinya lari
      ke istana Airlangga di Jawa Timur → menikah → jadi permaisuri
      Dharmaprasadottungadevi. Airlangga membangun Vihara Srivijayasrama
      (1035) untuk menghormati istrinya. INI MENUNJUKKAN bahwa pasca-Pralaya
      Mataram dan diserang-Chola Sriwijaya bersekutu lewat pernikahan untuk
      menghadapi dunia baru.
    sumber: "Prasasti Srivijayasrama (1035 M), Inscription Tanjore (1030 M)"

  hubungan_5_mataram_china_tang:
    jenis: "Diplomasi internasional"
    periode: "Abad 8-10 M (Dinasti Tang 618-907, Dinasti Song 960-1279)"
    pihak: "Mataram Kuno ↔ Dinasti Tang (Cina)"
    narasi: >
      Catatan Dinasti Tang mencatat 'Heling' / 'Dvapanta' (Kalingga) sebagai
      kerajaan Jawa. Catatan Song mencatat 'Shepo' (Java). Utusan Jawa ke
      Cina: 860 (utusan Heling), 992 (utusan Jawa ke Song). Mataram Kuno
      secara reguler mengirim utusan ke Cina — untuk mendapatkan legitimasi
      imperial Cina (yang penting untuk perdagangan) dan untuk membangun
      persekutuan melawan kerajaan lain di Asia Tenggara.
    sumber: "Berita Cina Dinasti Tang dan Song (catatan istana Cina)"

  hubungan_6_i_tsing_sriwijaya_mataram:
    jenis: "Pertukaran agama-budaya (Buddha)"
    periode: "671-695 M"
    pihak: "I-Tsing (pendeta Cina) ↔ Sriwijaya ↔ Mataram (Kalingga)"
    narasi: >
      I-Tsing (635-713 M), pendeta Buddha Cina, singgah di Sriwijaya 6 bulan
      (671 M) untuk belajar Sanskerta sebelum ke India (Nalanda). Ia kembali
      ke Sriwijaya 685-689 M untuk menyalin naskah Buddha. Dalam catatannya,
      ia menyebutkan 'Heling' (Kalingga) sebagai kerajaan Jawa dengan
      komunitas Buddha yang aktif — pendeta Cina Huining tinggal di Holing
      3 tahun (664-667 M) untuk belajar dengan pendeta lokal Jnanabhadra.
      INI MENUNJUKKAN JARINGAN BUDDHA: Cina-Sriwijaya-Mataram-India pada
      abad 7. Sumber paling detail tentang Kalingga berasal dari I-Tsing.
    sumber: "Catatan I-Tsing: 'Nanhai Jigui Neifa Zhuan' (692 M)"

  hubungan_7_pramodawardhani_rakai_pikatan:
    jenis: "Pernikahan penyatuan dinasti dalam (internal Mataram)"
    periode: "± 833-856 M"
    pihak: "Pramodawardhani (Syailendra-Buddha) ↔ Rakai Pikatan (Sanjaya-Hindu)"
    narasi: >
      Pramodawardhani adalah putri Samaratungga (raja Syailendra-Buddha,
      pembangun Borobudur). Rakai Pikatan adalah pangeran Sanjaya-Hindu.
      Pernikahan mereka menyatukan dua wangsa yang selama 100 tahun
      berbagi Jawa Tengah. Setelah pernikahan, Rakai Pikatan membangun
      Candi Prambanan (856 M) sebagai jawaban Hindu terhadap Borobudur
      Buddha. Tetapi saudara Pramodawardhani, Balaputradewa, menolak
      pernikahan → pecah perang saudara → Balaputradewa kalah → lari ke
      Sriwijaya. INI ADALAH HUBUNGAN INTERNAL YANG MENGUBAH POLITIK
      MASYARAKAT NUSANTARA: lahirnya Wangsa Sanjaya dominan + Sriwijaya
      di bawah Syailendra pelarian.
    sumber: "Prasasti Siwagrha/Wantil (856 M), Prasasti Nalanda (860 M)"

  hubungan_8_wurawari_pralaya_1016:
    jenis: "Perang pemusnah"
    periode: "1016 M (Pralaya Medang)"
    pihak: "Aji Wurawari dari Lwaram ↔ Raja Mataram (Dharmawangsa Teguh)"
    narasi: >
      Aji Wurawari dari Lwaram (diduga bawahan Mataram atau kerajaan kecil
      vassal yang memberontak) menyerang istana Medang di Jawa Timur.
      Raja Dharmawangsa Teguh tewas. Seluruh istana dibakar. Pralaya
      Medang 1016 M — akhir era Mataram Kuno. Airlangga (cucu Mpu Sindok,
      keponakan Dharmawangsa) selamat karena lari ke hutan Vanagiri
      (Wonogiri). Nantinya (1019-1042) Airlangga membangun Kahuripan untuk
      menggantikan Mataram. Asal-usul Wurawari tidak jelas — diduga
      sekutu Sriwijaya yang memanfaatkan ketegangan internal Mataram.
      Tidak ada bukti langsung, tetapi waktu yang berdekatan (1016
      Pralaya Mataram, 1025 Chola serang Sriwijaya) menunjukkan dunia
      Asia Tenggara abad 11 dalam turbulensi.
    sumber: "Prasasti Pucangan/Calcutta (~1041 M), Serat Calon Arang (legenda)"

  hubungan_9_mataram_india_pallava:
    jenis: "Pertukaran agama-budaya (Hindu-Buddha)"
    periode: "Abad 4-9 M"
    pihak: "Mataram Kuno ↔ India (Pallava, Pala, Chola)"
    narasi: >
      Aksara Pallawa (dari India Selatan, dinasti Pallava abad 4-9) dipakai
      di semua prasasti Mataram Kuno — Prasasti Canggal, Kalasan, Mantyasih,
      Nalanda, dll. Bahasa Sanskerta dipakai di prasasti. Arsitektur candi
      Mataram menunjukkan pengaruh India Selatan (gaya Pallava) untuk Hindu
      dan India Utara (gaya Pala-Benggala) untuk Buddha. Pendeta Buddha
      India (Sakyakirti, dll) datang ke Jawa — tercatat dalam Prasasti
      Kelurak (782 M). Prasasti Nalanda (860 M) di India — Balaputradewa
      mendirikan asrama untuk pendeta Jawa di Nalanda India. INI ADALAH
      HUBUNGAN BUDAYA DUA ARAH: Jawa-India saling mengirim pendeta, naskah,
      arsitek.
    sumber: "Prasasti Nalanda (860 M, di India), Prasasti Kelurak (782 M), berbagai prasasti Mataram dengan aksara Pallawa"

  hubungan_10_mataram_khmer_champa:
    jenis: "Mandala Hindu Asia Tenggara"
    periode: "Abad 8-11 M"
    pihak: "Mataram ↔ Khmer (Kamboja) ↔ Champa (Vietnam)"
    narasi: >
      Tidak ada kontak politik langsung yang terdokumentasi, tetapi ketiga
      kerajaan (Mataram, Khmer, Champa) adalah bagian dari "mandala Hindu
      Asia Tenggara" — peradaban Hindu yang membentang dari Jawa ke Vietnam.
      Ciri-ciri sama: Hindu Siwa, prasasti Sanskerta, aksara Pallawa,
      candi batu, relief Ramayana, konsep Devaraja. Angkor Wat (Khmer,
      1113-1150), My Son (Champa, abad 4-13), Prambanan (Mataram, 856) —
      tiga kompleks candi Hindu raksasa dibangun hampir sezaman dalam
      1 mandala budaya. Hubungan maritim lewat pedagang India yang
      singgah di Jawa-Kamboja-Vietnam.
    sumber: "Perbandingan arsitektur dan prasasti Asia Tenggara abad 8-13"

# =============================================================================
# HUBUNGAN INTERNASIONAL — Asia Tenggara, India, Cina
# =============================================================================
international_relations:
  deskripsi: >
    Mataram Kuno adalah bagian dari jaringan internasional Asia Tenggara-India-
    Cina abad 8-11. Mereka berdagang dengan Cina (Tang-Song), bertukar pendeta
    dengan India (Pallava, Pala, Nalanda), berperang/bersekutu dengan Chola
    (India Selatan), dan berinteraksi kultural dengan Champa-Khmer (Vietnam-
    Kamboja). Berikut peta hubungan internasional Mataram:

  cina_tang_dynasty:
    periode: "618-907 M (Dinasti Tang)"
    jenis_hubungan: "Diplomasi + perdagangan"
    dokumentasi:
      - "Berita Cina menyebut 'Heling' (Kalingga) abad 7"
      - "I-Tsing (671 M) — catatan paling detail tentang Jawa abad 7"
      - "Utusan Heling ke istana Tang 860 M"
    komoditas_dagang:
      - "Ekspor Jawa: cengkeh, pala, lada, kapur barus, gading, gaharu"
      - "Impor dari Cina: sutera, keramik, koin perunggu"
    signifikansi: >
      Hubungan dengan Cina penting untuk legitimasi politik — raja Jawa
      yang diakui Cina mendapat prestise sebagai "raja upacara" Asia
      Timur. Mataram Kuno mengirim utusan ke Tang 860-an untuk
      mengonsolidasikan posisi internasional.

  cina_song_dynasty:
    periode: "960-1279 M (Dinasti Song)"
    jenis_hubungan: "Diplomasi + perdagangan intensif"
    dokumentasi:
      - "Utusan 'She-po' (Jawa) ke Song 992 M"
      - "Utusan Sanfoqi (Sriwijaya) 960, 962, 980-983, 988-992, 1003, 1008, 1017, 1028"
      - "Catatan Zhao Rugua 'Zhufan Zhi' (1225) — deskripsi Jawa"
    komoditas_dagang:
      - "Ekspor Jawa: rempah, kayu cendana, gading, mutiara"
      - "Impor: sutera Song, keramik Qingbai, koin perunggu"
    signifikansi: >
      Era Song adalah puncak perdagangan maritim Asia Timur. Mataram
      Kuno periode Mpu Sindok-Dharmawangsa (929-1016) aktif mengirim
      utusan. Pasca-Pralaya 1016, hubungan terputus. Airlangga (1019-1042)
      tidak mengirim utusan ke Song — fokus internal.

  india_pallava_pala:
    periode: "Abad 4-9 M (Pallava), abad 8-12 M (Pala)"
    jenis_hubungan: "Budaya-agama + pendeta"
    dokumentasi:
      - "Aksara Pallawa (Pallava) dipakai di semua prasasti Mataram abad 7-9"
      - "Prasasti Nalanda (860 M) — di Bengal, India — Balaputradewa mendirikan asrama"
      - "Prasasti Kelurak (782 M) — pendeta Buddha 'Sakyakirti' dari Bengal mengajar di Jawa"
      - "Candi Borobudur — pengaruh Pala-Benggala (gaya stupa, Buddha Vajrayana)"
      - "Candi Prambanan — pengaruh Pallava-Coromandel (gaya Sikhara, Hindu Siwa)"
    signifikansi: >
      India adalah sumber kultural Mataram Kuno. Aksara, agama, bahasa
      Sanskerta, arsitektur candi, sastra Ramayana-Mahabharata — semua
      akar India. Hubungan dua arah: pendeta Jawa belajar di Nalanda
      (India), pendeta India datang ke Jawa (Sakyakirti).

  chola_india_south:
    periode: "Abad 9-13 M (Chola)"
    jenis_hubungan: "Awalnya dagang, akhirnya perang (1025)"
    dokumentasi:
      - "Rajendra Chola I (1014-1044) — serang Sriwijaya 1025"
      - "Tanjore Inscription (1030) — daftar kota yang ditawan Chola"
      - "Pengaruh Chola: hubungan langsung Mataram-Chola lewat pernikahan
        Airlangga dengan putri Sriwijaya (yang lari dari Chola)"
    signifikansi: >
      Chola adalah kekuatan maritim India Selatan abad 10-11. Awalnya
      hubungan dagang dengan Sriwijaya-Mataram. Tetapi 1025 Rajendra I
      menyerang Sriwijaya — pecah perang India-Nusantara yang mengubah
      peta politik. Chola menawan Sangrama Vijayatunggavarman (Sriwijaya),
      menjarah Palembang, mengakhiri hegemoni Buddha Sriwijaya. INI
      MEMBUKA JALAN untuk Airlangga-Kahuripan di Jawa dan Dharmasraya-
      Melayu di Sumatera abad 11-13.

  champa_vietnam:
    periode: "Abad 2-15 M"
    jenis_hubungan: "Budaya-mandala Hindu"
    dokumentasi:
      - "Prasasti Campa menggunakan aksara yang serupa dengan Mataram"
      - "Bahasa Sanskerta di prasasti Champa dan Mataram"
      - "Candi My Son (Vietnam) — mirip Prambanan secara struktural"
      - "Tidak ada utusan langsung Champa-Mataram yang tercatat"
    signifikansi: >
      Champa dan Mataram adalah dua kerajaan Hindu saudara di Asia
      Tenggara. Tidak ada hubungan politik langsung, tetapi keduanya
      adalah bagian dari mandala Hindu yang sama.

  khmer_cambodia:
    periode: "802-1431 M (Khmer Empire)"
    jenis_hubungan: "Mandala Hindu + politik tidak langsung"
    dokumentasi:
      - "Jayavarman II (802) — pendiri Khmer, sezaman dengan Rakai Panangkaran Mataram"
      - "Suryavarman I (1006-1050) — minta bantuan Chola melawan Sriwijaya"
      - "Angkor Wat (1113-1150) — sezaman dengan puncak Singasari"
    signifikansi: >
      Khmer adalah kerajaan Hindu terbesar di daratan Asia Tenggara.
      Hubungan tidak langsung dengan Mataram lewat Chola-Sriwijaya.
      Khmer dan Mataram adalah dua pilar Hindu di Asia Tenggara abad 9-13.

