# =============================================================================
# MASTER PHASE 1 — ERA MATARAM KUNO / MEDANG (732–1016 M)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT 3x dengan cross-check ke sumber primer
# Tanggal: 17 Oktober 2026
# Versi: 3.0 (master YAML)
# =============================================================================

meta:
  era: "Mataram Kuno / Medang"
  periode: "732–1016 M"
  lokasi_geografis: "Jawa Tengah (Magelang, Temanggung, Wonosobo, Banjarnegara, Sleman, Klaten) → Jawa Timur (Jombang) pasca-929 M"
  dinasti_dominan:
    - wangsa: "Sanjaya"
      agama: "Hindu Siwa"
      pendiri: "Sanjaya (732 M)"
    - wangsa: "Syailendra"
      agama: "Buddha Mahayana"
      pendiri: "Dapunta Selendra (± awal abad 8)"
    - wangsa: "Isyana"
      agama: "Hindu Siwa-Buddha sinkretis"
      pendiri: "Mpu Sindok (929 M, pindah ke Jawa Timur)"
  sumber_primer:
    - "Prasasti Canggal (732 M)"
    - "Prasasti Kalasan (778 M)"
    - "Prasasti Kelurak (782 M)"
    - "Prasasti Manjusrigrha (792 M)"
    - "Prasasti Dieng (808 M)"
    - "Prasasti Karangtengah/Kayumwungan (824 M)"
    - "Prasasti Gunung Wule (861 M)"
    - "Prasasti Argapura (863 M)"
    - "Prasasti Nalanda (860 M)"
    - "Prasasti Siwagrha/Wantil (856 M)"
    - "Prasasti Panunggalan (896 M)"
    - "Prasasti Mantyasih (907 M)"
    - "Prasasti Rukam (907 M)"
    - "Prasasti Wanua Tengah III (908 M)"
    - "Prasasti Poh Galuh (910-an M)"
    - "Prasasti Anjuk Ladang (937 M)"
    - "Prasasti Calcutta/Pucangan (± 1041 M)"
    - "Carita Parahyangan (naskah Sunda abad 16)"
    - "Berita Cina Dinasti Tang (untuk Kalingga/Ratu Shima)"
  catatan_penting: >
    Negarakretagama (1365 M) dan Pararaton (abad 16) TIDAK membahas era
    Mataram Kuno secara langsung — kedua kitab hanya membahas Singasari-Majapahit.
    Sumber primer era Mataram Kuno adalah prasasti + Carita Parahyangan + Berita Cina.

# =============================================================================
# NARASI SINGKAT — Storytelling untuk Drama
# =============================================================================
narrative:
  era_overview: >
    Di kaki Gunung Merapi, di lembah Kedu yang subur, sebuah peradaban lahir dari
    asap dupa Siwa dan lonceng Buddha. Mataram Kuno — peradaban dua wangsa yang
    berbagi satu bumi: Sanjaya Hindu di utara, Syailendra Buddha di selatan.
    Selama tiga abad, mereka membangun candi-candi megah yang menjulang ke langit,
    mengukir relief yang menceritakan epik Ramayana dan kisah Buddha. Tapi di balik
    keagungan candi, ada intrik istana, perebutan takhta, raja yang 'minggat'
    dari kraton, dan akhirnya bencana — Pralaya 1016 M, ketika Aji Wurawari dari
    Lwaram membakar istana dan mengakhiri era Mataram Kuno. Dari abu Pralaya,
    seorang pangeran Bali bernama Airlangga membangun kembali kerajaan di Jawa Timur.

  akt_1_founding: >
    Sanjaya, cicit Maharani Shima dari Kalingga, naik takhta tahun 732 M.
    Ia mendirikan lingga di Bukit Sthirengga (Gunung Wukir) — tanda kelahiran
    Wangsa Sanjaya. Sementara itu, di pesisir utara Jawa, Dapunta Selendra
    memulai garis wangsa Buddha Syailendra. Dua wangsa, dua agama, satu bumi.
    Era pendirian: candi Hindu kecil di Dieng mulai dibangun, kompleks ritual
    di pegunungan menjadikan Jawa Tengah sebagai mandala kosmik.

  akt_2_golden_age: >
    Abad ke-8 hingga ke-9 adalah era keemasan. Rakai Panangkaran berpindah ke
    Buddha, membangun Candi Kalasan untuk dewi Tara. Samaratungga dari Syailendra
    menyelesaikan Borobudur ± 825 M — candi Buddha terbesar di dunia. Rakai Garung
    di Wonosobo memerintah di kaki Dieng. Lalu datang Rakai Pikatan — menikahi
    Pramodawardhani, menyatukan dua wangsa, dan membangun Candi Prambanan yang
    menjulang sebagai jawaban Hindu terhadap Borobudur Buddha.

  akt_3_instability: >
    Setelah era Rakai Kayuwangi (855-885 M), kekacauan dimulai. Tiga raja
    memerintah singkat — Dyah Tagwas (6 bulan), Rakai Panumwangan (2 tahun),
    Rakai Gurunwangi yang 'minggat' dari kraton. Selama 8 tahun, Jawa tanpa raja.
    Lalu Rakai Watuhumalang muncul dari kekosongan, diikuti Balitung yang
    melegitimasi kekuasaan dengan membuat daftar raja-raja sebelumnya.

  akt_4_eastward_migration: >
    929 M. Mpu Sindok memindahkan pusat kerajaan ke Jawa Timur, mendirikan
    Wangsa Isyana di Watugaluh (Jombang). Era Mataram Kuno periode Jawa Tengah
    berakhir. Bencana Merapi? Tekanan Sriwijaya? Atau strategi ekonomi dagang
    Sungai Brantas? Tidak ada yang tahu pasti. Yang jelas, peradaban pindah
    ke timur, meninggalkan candi-candi yang akan terkubur abad-abad berikutnya.

  akt_5_pralaya_and_rebirth: >
    1016 M. Aji Wurawari dari Lwaram menyerang istana Medang di Jawa Timur.
    Raja Dharmawangsa Teguh tewas. Pralaya — bencana — menghancurkan
    peradaban Mataram. Tapi keponakan Dharmawangsa, pangeran Bali Airlangga,
    selamat dengan berlindung di hutan Vanagiri. Tahun 1019, ia naik takhta,
    membangun Kerajaan Kahuripan, memulihkan kejayaan, dan sebelum wafat
    1049 M membagi kerajaan menjadi Janggala dan Kadiri — yang kelak
    melahirkan Kerajaan Kadiri, lalu Singasari, lalu Majapahit.

