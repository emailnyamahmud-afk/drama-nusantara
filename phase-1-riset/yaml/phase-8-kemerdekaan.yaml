# =============================================================================
# MASTER PHASE 8 — ERA KEMERDEKAAN / REVOLUSI (1945–1949 M)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT dengan cross-check ke sumber primer termasuk dokumen Marxis
#         (Madilog Tan Malaka, arsip PKI/Comintern, arsip Sneevliet IISG)
# Tanggal: 17 Oktober 2026
# Versi: 1.0 (master YAML phase 8)
# =============================================================================

meta:
  era: "Era Kemerdekaan / Revolusi Nasional Indonesia"
  periode: "1945–1949 M (4 tahun)"
  lokasi_geografis: "Jakarta → Yogyakarta (ibu kota revolusi) → seluruh Indonesia"
  penguasa: "Republik Indonesia (RI) vs Belanda (NICA/KNIL) vs Jepang (awal)"
  ibu_kota: "Jakarta (1945-1946) → Yogyakarta (1946-1949)"
  agama: "Islam (mayoritas), Kristen, Hindu-Buddha, Marxisme/Ateisme"
  sumber_primer:
    - "Naskah Proklamasi (asli, Museum Nasional)"
    - "Arsip BPUPKI/PPKI — di ANRI"
    - "Madilog karya Tan Malaka (1943) — karya filsafat Marxis terbesar Indonesia"
    - "Dari Penjara ke Penjara karya Tan Malaka — otobiografi"
    - "Dokumen PKI (1920-1965) — di ANRI dan IISG Amsterdam"
    - "Arsip Comintern di RGASPI Moscow — komunikasi PKI-Moscow"
    - "Arsip Sneevliet di IISG Amsterdam — pendiri ISDV/PKI"
    - "Laporan polisi rahasia Hindia Belanda (Politieke Inlichtingendienst)"
    - "Sumber akademis: M.C. Ricklefs, Ruth McVey (The Rise of Indonesian Communism), Robert Cribb"
  catatan_penting: >
    Era Kemerdekaan tidak bisa dipahami tanpa memahami garis panjang
    pergerakan Marxis-Komunis di Indonesia (1914-1965). Tokoh Marxis seperti
    Tan Malaka, Musso, Semaun, dan Aidit memainkan peran sentral dalam era ini.

# =============================================================================
# NARASI SINGKAT
# =============================================================================
narrative:
  era_overview: >
    Dari vacuum of power setelah Jepang menyerah, melalui proklamasi yang
    dipaksakan oleh pemuda, melalui empat tahun perang revolusi dan diplomasi,
    hingga pengakuan kedaulatan 27 Desember 1949. Era ini juga dipenuhi
    konflik internal: nasionalis vs Marxis, diplomasi vs perjuangan bersenjata,
    Soekarno vs Tan Malaka, yang memuncak dalam Peristiwa Madiun 1948.

  akt_1_proclamation: >
    17 Agustus 1945. Soekarno dan Hatta memproklamasikan kemerdekaan di
    Jalan Pegangsaan Timur 56. Naskah diketik oleh Sayuti Melik (anggota
    Menteng 31, sayap kiri). BPUPKI dan PPKI dibentuk. Vacuum of power
    setelah Jepang menyerah.

  akt_2_revolution: >
    Pertempuran 10 November 1945 di Surabaya — Bung Tomo berorasi lewat
    radio, arek Surabaya melawan Inggris. Bandung Lautan Api 1946.
    Ibu kota pindah ke Yogyakarta. Sultan Hamengkubuwana IX mendukung RI.
    Diplomasi: Linggarjati (1946), Renville (1948).

  akt_3_marxist_challenge: >
    Tan Malaka mendirikan Persatuan Perjuangan (Januari 1946) — koalisi
    140 sayap kiri. Menuntut diplomasi keras vs Belanda. Soekarno membubarkan
    (Juli 1946). Tan Malaka ditangkap. Musso kembali dari Moscow (Agustus 1948).
    Peristiwa Madiun 18 September 1948 — PKI/FDR memberontak. Musso tewas.
    Tan Malaka dibebaskan, lalu dieksekusi TNI (Februari 1949).

  akt_4_recognition: >
    Agresi Militer Belanda II (Desember 1948) — Yogyakarta diduduki.
    Soekarno-Hatta ditangkap. Sudirman memimpin gerilya. Serangan Umum
    1 Maret 1949 — TNI merebut Yogyakarta sebentar. Perjanjian Roem-van
    Royen (1949). KMB di Den Haag. Pengakuan kedaulatan 27 Desember 1949.

# =============================================================================
# GARIS WAKTU PERGERAKAN MARXIS-KOMUNIS (1914–1965)
# =============================================================================
marxist_timeline:
  note: >
    Era Kemerdekaan tidak bisa dipahami tanpa memahami garis panjang
    pergerakan Marxis-Komunis di Indonesia.
  events:
    - year: "1914"
      event: "ISDV (Indische Sociaal-Democratische Vereeniging) didirikan di Surabaya oleh Henk Sneevliet"
      key_figures: ["Sneevliet", "Semaun", "Baars"]
    - year: "1917"
      event: "Revolusi Bolshevik Rusia — inspirasi bagi Marxis Hindia"
      key_figures: ["Tan Malaka (di Belanda)"]
    - year: "1920"
      event: "ISDV berubah menjadi PKH/PKI (23 Mei 1920). Semaun menjadi ketua pertama PKI."
      key_figures: ["Semaun", "Alimin", "Darsono"]
    - year: "1921"
      event: "Sarekat Islam pecah: SI Merah (komunis) vs SI Putih (Islam)"
      key_figures: ["Semaun", "Tjokroaminoto"]
    - year: "1923"
      event: "Tan Malaka menjadi ketua PKI (menggantikan Semaun yang ke Moskow)"
      key_figures: ["Tan Malaka"]
    - year: "1926-1927"
      event: "Pemberontakan PKI di Banten (12-13 November 1926) dan Silungkang (1 Januari 1927). Gagal. Tan Malaka menolak rencana ini. Ribuan dibuang ke Boven Digul."
      key_figures: ["Alimin", "Musso", "Tan Malaka (menolak)"]
    - year: "1927-1948"
      event: "Tan Malaka mengembara di Asia dengan 23 nama samaran. Menulis Madilog (1943)."
      key_figures: ["Tan Malaka"]
    - year: "1935"
      event: "PKI bawah tanah dibentuk kembali oleh Musso, Alimin"
      key_figures: ["Musso", "Alimin"]
    - year: "1945"
      event: "Proklamasi. Tan Malaka kembali ke Indonesia."
      key_figures: ["Tan Malaka", "Soekarno"]
    - year: "1946"
      event: "Tan Malaka mendirikan Persatuan Perjuangan (Januari 1946) — koalisi 140 sayap kiri. Dibubarkan Soekarno (Juli 1946). Tan Malaka ditangkap."
      key_figures: ["Tan Malaka", "Soekarno"]
    - year: "1948"
      event: "Musso kembali dari Moscow (Agustus). Peristiwa Madiun 18 September 1948. Musso tewas 31 Oktober. Tan Malaka dieksekusi TNI (Februari 1949)."
      key_figures: ["Musso", "Tan Malaka", "Soekarno"]
    - year: "1951"
      event: "DN Aidit, Lukman, Njoto, Sudisman mengambil alih PKI. PKI jadi partai massa 3 juta."
      key_figures: ["DN Aidit", "Lukman", "Njoto"]
    - year: "1965"
      event: "G30S/PKI (30 September 1965). Pembantaian massal terhadap PKI (1965-1966)."
      key_figures: ["DN Aidit", "Njoto", "Lukman", "Soeharto"]

