production_notes:
  color_palette_overall:
    description: >
      Era Kemerdekaan memiliki palet warna yang mencerminkan kontras:
      putih (nasionalis/kemerdekaan), hitam (Marxis/formal), hijau zaitun (militer),
      merah (komunis/Marxis), merah-putih (bendera).
    primary_colors:
      - "Putih (jas Soekarno, jubah Hizbullah)"
      - "Hitam (jas Marxis, peci)"
      - "Hijau zaitun (seragam militer)"
      - "Coklat (kain batik, jas lokan)"
    accent_colors:
      - "Merah (bendera, beret Marxis, bintang)"
      - "Emas (keris, perhiasan keraton)"

  cultural_authenticity:
    important_details:
      - "Soekarno: jas putih + peci hitam — simbol nasionalis-modernis"
      - "Hatta: jas abu-abu + kacamata — simbol intelektual-pragmatis"
      - "Tan Malaka: jas hitam sederhana + peci — master of disguise (23 identitas)"
      - "Musso: jas hitam + peci — ortodoks Moskow-line"
      - "Aidit: jas hitam + peci + beret merah (kadang) — Marxis populis"
      - "Pejuang revolusi: pakaian campuran (militer Jepang + batik + peci)"
      - "Hizbullah: jubah putih + sorban — pasukan Islam"
      - "Bambu runcing: simbol perjuangan rakyat yang tidak punya senjata modern"

