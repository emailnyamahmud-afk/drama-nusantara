# =============================================================================
# MASTER PHASE 5 — ERA KESULTANAN PAJANG (1568–1587 M)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT dengan cross-check ke sumber primer (Babad Tanah Jawi,
#         Babad Mataram, H.J. de Graaf & Pigeaud)
# Tanggal: 17 Oktober 2026
# Versi: 1.0 (master YAML phase 5)
# =============================================================================

meta:
  era: "Kesultanan Pajang"
  periode: "1568–1587 M"
  lokasi_geografis: "Pedalaman Jawa Tengah (Kartasura, Sukoharjo, Surakarta)"
  dinasti: "Kelanjutan dari Demak (Wangsa Rajasa)"
  ibu_kota: "Bumi Pajang (sekarang Kartasura, Sukoharjo, Jawa Tengah)"
  agama: "Islam Sunni"
  sumber_primer:
    - "Babad Tanah Jawi (abad 18-19) — sumber utama naratif"
    - "Babad Mataram — untuk transisi Pajang-Mataram"
    - "Serat Kanda dan Serat Menak — sumber sekunder"
    - "H.J. de Graaf dan T.H. Pigeaud (2001) Kerajaan Islam Pertama di Jawa — kajian akademis"
    - "Moedjianto (1987) Konsep Kekuasaan Jawa: Penerapannya oleh Raja-raja Mataram"
  catatan_penting: >
    Tidak ada prasasti resmi dari era Pajang. Sejarah direkonstruksi dari
    Babad Tanah Jawi yang ditulis ratusan tahun setelahnya.
    KOREKSI PENTING: Sutawijaya TIDAK mengalahkan Pangeran Benawa —
    mereka BERSEKUTU melawan Arya Pangiri. Putri Pangeran Benawa
    (Dyah Banowati) menikah dengan putra Sutawijaya (Mas Jolang) —
    anak mereka adalah Sultan Agung.

# =============================================================================
# NARASI SINGKAT — Storytelling untuk Drama
# =============================================================================
narrative:
  era_overview: >
    Dari pedalaman Jawa Tengah, Sultan Hadiwijaya (Jaka Tingkir) membangun
    Pajang sebagai penerus Demak. Tapi Pajang hanya bertahan 19 tahun —
    kerajaan transisional yang menjembatani Demak dan Mataram Islam.
    Setelah kematian Hadiwijaya 1582, krisis suksesi pecah: Arya Pangiri
    merebut takhta dari Pangeran Benawa. Tapi Pangeran Benawa bersekutu
    dengan Sutawijaya — saudara angkatnya yang sudah menjadi adipati Mataram.
    Bersama mereka mengalahkan Arya Pangiri 1586. Pangeran Benawa naik takhta,
    lalu menyerahkannya ke Sutawijaya yang mendirikan Mataram Islam 1587.
    Dari pernikahan putri Benawa dengan putra Sutawijaya lahirlah Sultan Agung.

  akt_1_founding: >
    1568 M. Jaka Tingkir (Mas Karebet), putra Ki Ageng Pengging dari Tingkir
    (Salatiga), memenangkan krisis suksesi Demak dengan mengalahkan Arya
    Penangsang lewat Sutawijaya. Memindahkan pusat kerajaan dari pesisir Demak
    ke pedalaman Pajang (Kartasura, Sukoharjo). Era stabil dan damai di
    bawah Hadiwijaya.

  akt_2_succession_crisis: >
    1582 M. Hadiwijaya wafat setelah perang dengan Mataram (Sutawijaya
    memberontak). Arya Pangiri — menantu Hadiwijaya, putra Sunan Prawoto
    (raja Demak ke-4) — merebut takhta dari Pangeran Benawa (putra kandung
    Hadiwijaya). Dukungan: Sunan Kudus. Alasan: Pangeran Benawa lebih muda
    dari istri Pangiri. Arya Pangiri bergelar Sultan Awantipura. Masa
    pemerintahan: sibuk balas dendam ke Mataram, rakyat Pajang tertindas.

  akt_3_alliance_and_victory: >
    1586 M. Pangeran Benawa (adipati Jipang) bersekutu dengan Sutawijaya
    (adipati Mataram) — saudara angkatnya. Mereka berunding di desa Weru,
    lalu menyerbu Pajang. Pasukan gabungan Mataram-Jipang mengalahkan pasukan
    Arya Pangiri (300 Pajang + 2000 Demak + 400 seberang). Arya Pangiri
    diampuni atas permohonan Ratna Pembayun (istri Pangiri, putri Hadiwijaya),
    dikembalikan ke Demak.

  akt_4_transition: >
    1586-1587 M. Pangeran Benawa naik takhta sebagai Sultan Prabuwijaya.
    Putrinya Dyah Banowati dinikahkan dengan Mas Jolang (putra Sutawijaya) —
    anak mereka kelak menjadi Sultan Agung. Pangeran Benawa menyerahkan
    takhta ke Sutawijaya yang mendirikan Kesultanan Mataram Islam 1587.
    Pajang menjadi bawahan Mataram.

# =============================================================================
# DAFTAR SULTAN
# =============================================================================
sultans_list:
  source_primary: "Babad Tanah Jawi (abad 18-19)"
  note: >
    3 sultan Pajang. Tidak ada prasasti resmi.
  sultans:
    - number: 1
      name: "Sultan Hadiwijaya"
      alt_names: ["Jaka Tingkir", "Mas Karebet"]
      full_title: "Sultan Adiwijaya"
      reign: "1568–1582 M"
      source: "Babad Tanah Jawi"
      note: "Pendiri Pajang. Lahir Mas Karebet di Tingkir (Salatiga). Putra Ki Ageng Pengging (Kebo Kenongo). Wafat 1582 setelah perang dengan Mataram."
    - number: 2
      name: "Arya Pangiri"
      full_title: "Sultan Awantipura"
      reign: "1583–1586 M"
      source: "Babad Tanah Jawi"
      note: "Menantu Hadiwijaya (suami Ratna Pembayun). Putra Sunan Prawoto (raja Demak ke-4). Merebut takhta dari Pangeran Benawa. Dikalahkan persekutuan Benawa-Sutawijaya 1586."
    - number: 3
      name: "Pangeran Benawa"
      full_title: "Sultan Prabuwijaya"
      reign: "1586–1587 M"
      source: "Babad Tanah Jawi"
      note: "Putra kandung Hadiwijaya. Bersekutu dengan Sutawijaya. Putrinya Dyah Banowati menikah dengan Mas Jolang — anak mereka Sultan Agung. Menyerahkan takhta ke Sutawijaya 1587."

