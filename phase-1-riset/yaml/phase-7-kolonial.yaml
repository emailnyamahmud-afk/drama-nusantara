      lower_body: "Celana panjang militer putih"
      accessories: ["Pedang sisi militer (sabre)", "Sepatu bot kulit hitam"]
    color_palette:
      primary: "Biru tua (seragam militer)"
      accent: "Emas (epaulet, tombak), putih (celana)"
    prompt_t2i:
      character_portrait: >
        Cinematic portrait of Herman Willem Daendels, Dutch colonial governor-
        general 19th century, stern military man 40-50 with determined eyes,
        wearing dark blue Napoleonic-era military uniform with gold epaulettes,
        bicorne hat, white trousers, black boots, holding sabre sword, Jalan
        Raya Pos construction background with Javanese workers, dramatic golden
