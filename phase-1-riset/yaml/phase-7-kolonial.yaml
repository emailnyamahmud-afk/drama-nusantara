# =============================================================================
# CATATAN PRODUKSI
# =============================================================================
production_notes:
  color_palette_overall:
    description: >
      Era kolonial memiliki palet warna yang sangat beragam karena 340 tahun
      dan banyak budaya bertemu — Eropa, Jawa, Tionghoa, Aceh, dll.
    primary_colors:
      - "Putih (jas kolonial Belanda)"
      - "Hitam (baju kurung Aceh)"
      - "Biru tua (seragam militer Daendels)"
      - "Coklat soga (kain batik Jawa)"
      - "Hijau zaitun (seragam KNIL)"
    accent_colors:
      - "Emas (epaulet, perhiasan)"
      - "Merah (kebaya peranakan)"
      - "Perak (rencong Aceh)"
  cultural_authenticity:
    important_details:
      - "Pejabat VOC: wig putih + justaucorps + tricorn — pengaruh abad 17 Eropa"
      - "Daendels: seragam militer Napoleonic (biru tua + epaulet emas + bicorne)"
      - "Raffles: jas putih linen kolonial + topi panama — orientalis Inggris"
      - "Diponegoro: jubah putih + sorban — sama dengan Mataram Islam tapi lebih sederhana"
      - "Cut Nyak Dhien: baju kurung Aceh hitam + kerudung — sangat tertutup"
      - "Kartini: kebaya putih + kain batik — simbol emansipasi"
      - "Cultuurstelsel: petani dalam kain kasar, telanjang kaki, kelelahan"
      - "Peranakan Tionghoa: baju pangsi + kain batik — sinkretisme Tionghoa-Jawa"

