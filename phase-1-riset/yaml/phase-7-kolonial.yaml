characters:

  jan_pieterszoon_coen:
    name: "Jan Pieterszoon Coen"
    era_period: "1587–1629 M (Gubernur-Jenderal VOC 1619-1623, 1627-1629)"
    age_dramatic: "30-40 tahun"
    religion: "Calvinist Dutch Reformed"
    narrative_short: >
      Pendiri Batavia. Gubernur-Jenderal VOC ke-4. Mendirikan Batavia 1619
      di atas puing Jayakarta. Genocida Banda 1621. Tewas di Batavia 1629
      saat penyerbuan Sultan Agung. Tokoh kontroversial — pahlawan Belanda,
      penjajah kejam bagi Indonesia.
    visual_physical:
      face: "Wajah Belanda, dingin, mata tajam"
      body: "Postur tegap pejabat VOC"
    wardrobe:
      headwear: "Wig putih keriting + topi tricorn (segi tiga)"
      upper_body: "Justaucorps (jas panjang hitam dengan kerah renda)"
      lower_body: "Knee-breeches (celana sebatas lutut) + kaus kaki putih"
      accessories: ["Rapier (pedang sisi Eropa)", "Sepatu bertongkat emas"]
    color_palette:
      primary: "Hitam (justaucorps)"
      accent: "Putih (wig, kaus kaki), emas (tongkat sepatu)"
    prompt_t2i:
      character_portrait: >
        Cinematic portrait of Jan Pieterszoon Coen, Dutch VOC governor-general
        17th century, stern bearded man 40s with white curly wig, black
        justaucorps coat with lace collar, tricorn hat under arm, holding rapier
        sword, Batavia castle harbor with VOC ships background, dramatic golden
        hour, hyperrealistic 8k masterpiece.
      wardrobe_detail: >
        Detailed wardrobe study of Jan Pieterszoon Coen 17th century Dutch VOC
        governor-general, white curly wig, black justaucorps coat with lace
        collar, knee-breeches with white stockings, tricorn hat, rapier sword,
        black-tongued gold-buckled shoes, black and white color palette with
        gold accents, matte fabric texture, museum-quality detail shot,
        hyperdetailed 8k.

  herman_willem_daendels:
    name: "Herman Willem Daendels"
    era_period: "1762–1818 M (Gubernur-Jenderal 1808-1811)"
    age_dramatic: "40-50 tahun"
    religion: "Calvinist"
