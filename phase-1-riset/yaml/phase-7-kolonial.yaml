# =============================================================================
# MASTER PHASE 7 — ERA KOLONIAL (VOC 1602–1799 & HINDIA BELANDA 1800–1942)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT dengan cross-check ke sumber primer (arsip VOC,
#         Suma Oriental, Max Havelaar, Babad Diponegoro, arsip ANRI)
# Tanggal: 17 Oktober 2026
# Versi: 1.0 (master YAML phase 7)
# =============================================================================

meta:
  era: "Era Kolonial (VOC & Hindia Belanda)"
  periode: "1602–1942 M (340 tahun)"
  lokasi_geografis: "Seluruh Nusantara — Batavia (Jakarta), Semarang, Surabaya, Bandung, Medan, Yogyakarta, Aceh, Maluku"
  penguasa: "VOC (1602-1799) → Hindia Belanda (1800-1942), dengan British Interregnum (1811-1816)"
  ibu_kota: "Batavia (Kota Tua → Weltevreden → Batavia/Batavia Centrum)"
  agama: "Islam (mayoritas), Kristen (kolonial), Hindu-Buddha (Bali), Animisme (pelosok)"
  sumber_primer:
    - "Arsip VOC (1602–1799) — di Nationaal Archief, Den Haag"
    - "Dagh-Register van Batavia — catatan harian VOC"
    - "Suma Oriental karya Tome Pires (1512–1515) — catatan Portugis"
    - "The History of Java karya Stamford Raffles (1817) — catatan Inggris"
    - "Max Havelaar karya Multatuli (1860) — novel yang mengungkap Cultuurstelsel"
    - "Babad Diponegoro / Babad Dipanagara — otobiografi Pangeran Diponegoro"
    - "Hikayat Aceh, Hikayat Prang Sabi — untuk Perang Aceh"
    - "Arsip Hindia Belanda (1800–1942) — di Arsip Nasional RI (ANRI)"
    - "Sumber akademis: H.J. de Graaf, Th. Pigeaud, M.C. Ricklefs, Robert Cribb"
  catatan_penting: >
    Era kolonial berlangsung 340 tahun — terpanjang dari semua era. Sumber primer
    paling lengkap dari semua era karena arsip VOC dan Hindia Belanda yang
    tersimpan di Belanda dan Indonesia.

# =============================================================================
# NARASI SINGKAT — Storytelling untuk Drama
# =============================================================================
narrative:
  era_overview: >
    Selama 340 tahun, Nusantara berada di bawah kekuasaan kolonial Eropa —
    pertama VOC (perusahaan dagang yang menjadi negara), lalu Hindia Belanda
    (koloni resmi Kerajaan Belanda). Dari kanal-kanal Batavia yang menyerupai
    Amsterdam, ke penderitaan petani Jawa di bawah Cultuurstelsel, ke perlawanan
    Diponegoro di hutan Jawa dan Cut Nyak Dhien di pegunungan Aceh, hingga
    lahirnya kesadaran nasional di sekolah-sekolah dan organisasi pergerakan.
    Era kolonial adalah era penderitaan, perlawanan, dan akhirnya kebangkitan.

  akt_1_voc: >
    1602 M. VOC didirikan di Belanda dengan monopoli dagang rempah-rempah
    Nusantara. 1619: Jan Pieterszoon Coen mendirikan Batavia di atas puing
    Jayakarta. 1621: genocida Banda untuk monopoli pala. Abad 17 adalah
    "Gouden Eeuw" Belanda — keemasan VOC. Tapi Sultan Agung menyerang Batavia
    1628-1629. VOC bertahan, tapi Mataram melemah. VOC bangkrut 1799 karena
    korupsi dan perang.

  akt_2_transition: >
    1808: Daendels tiba — membangun Jalan Raya Pos Anyer-Panarukan (~1000 km)
    dalam satu tahun. Banyak pekerja mati. 1811-1816: British Interregnum —
    Raffles memerintah Java dengan reformasi. 1816: Belanda kembali. 1825-1830:
    Perang Java — Pangeran Diponegoro memimpin perlawanan terbesar melawan
    Belanda di Jawa. 200.000 jiwa Jawa tewas. Diponegoro ditangkap 1830.

  akt_3_cultuurstelsel: >
    1830: Johannes van den Bosch menerapkan Cultuurstelsel (Sistem Tanam Paksa).
    Petani Jawa wajib menanam kopi, gula, nila, teh di 1/5 tanah dan menyerahkan
    hasil ke Belanda. 19% PDB Belanda berasal dari sistem ini — tapi jutaan
    petani Jawa mati kelaparan. 1860: Multatuli menulis Max Havelaar — novel
    yang mengungkap kekejaman dan menggemparkan Eropa. 1870: Cultuurstelsel
    dihapus, diganti dengan Politik Etis.

  akt_4_resistance: >
    1873-1904: Perang Aceh — perang terlama melawan Belanda. Cut Nyak Dhien
    dan Teuku Umar memimpin gerilya. Teuku Umar tewas 1899. Cut Nyak Dhien
    tertangkap 1904. Perlawanan lain: Perang Padri (1803-1837) di Sumatera,
    Perang Lombok (1894), Perang Batak (1872).

  akt_5_national_awakening: >
    1908: Boedi Oetomo didirikan — Hari Kebangkitan Nasional. 1911: Sarekat Islam.
    1912: Muhammadiyah. 1920: PKI. 1926: NU. 1928: Sumpah Pemuda. 1942:
    Jepang menginvasi Hindia Belanda. Akhir era kolonial Belanda. Awal pendudukan
    Jepang yang berakhir dengan Proklamasi Kemerdekaan 17 Agustus 1945.

# =============================================================================
# SUB-PERIODE
# =============================================================================
sub_periods:
  - name: "VOC"
    period: "1602–1799 M"
    key_figures: ["Jan Pieterszoon Coen", "Antonio van Diemen"]
    characteristics: "Monopoli dagang rempah, kanal Batavia, benteng-benteng VOC, perbudakan"
  - name: "British Interregnum"
    period: "1811–1816 M"
    key_figures: ["Stamford Raffles"]
    characteristics: "Reformasi: hapus kerja paksa, restorasi Borobudur, The History of Java"
  - name: "Daendels Era"
    period: "1808–1811 M"
    key_figures: ["Herman Willem Daendels"]
    characteristics: "Jalan Raya Pos Anyer-Panarukan (~1000 km), modernisasi militer, pindah ibu kota ke Weltevreden"
  - name: "Cultuurstelsel (Tanam Paksa)"
    period: "1830–1870 M"
    key_figures: ["Johannes van den Bosch", "Multatuli"]
    characteristics: "Sistem tanam paksa: kopi, gula, nila, teh. 19% PDB Belanda. Jutaan petani Jawa mati kelaparan."
  - name: "Ethische Politiek (Politik Etis)"
    period: "1901–1942 M"
    key_figures: []
    characteristics: "Edukasi, irigasi, migrasi. Setelah Max Havelaar (1860). STOVIA, sekolah-sekolah."
  - name: "Pergerakan Nasional"
    period: "1908–1942 M"
    key_figures: ["Soetomo", "H.O.S. Tjokroaminoto", "Haji Samanhudi", "K.H. Ahmad Dahlan", "K.H. Hasyim Asy'ari"]
    characteristics: "Boedi Oetomo (1908), Sarekat Islam (1911), Muhammadiyah (1912), PKI (1920), NU (1926), Sumpah Pemuda (1928)"

