title: "Bab VI — VOC di Pulau Banda: Monopoli Rempah, Kekerasan, dan Perbudakan"

summary: >
  Bab dramatik tentang eksploitasi VOC di Kepulauan Banda (Maluku) abad
  17. Membahas monopoli rempah-pala (nutmeg) VOC, konflik dengan penduduk
  lokal Bandanese, pembantaian 1621 oleh JP Coen yang menewaskan ribuan
  penduduk Banda dan memperbudak sisanya, lalu impor budak dari berbagai
  wilayah Nusantara dan luar negeri untuk kerja di kebun pala. Bab ini
  menjadi sumber penting untuk drama tentang kejahatan kolonial awal dan
  akar sejarah perdagangan budak di Nusantara.

