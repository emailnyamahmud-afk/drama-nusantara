# =============================================================================
# MASTER PHASE 9 — ERA ORDE LAMA (1950–1965 M)
# =============================================================================
# Dokumen komprehensif: riset sejarah + master reference untuk T2I prompt
# Format YAML untuk struktur data yang dapat dipakai oleh:
#   - Penulis naskah drama (narrative + characters)
#   - Artist/Art Director (wardrobe + visual)
#   - AI prompt engineer (prompt library untuk Stable Diffusion)
#
# Status: AUDIT dengan fokus konflik politik, pemberontakan, hubungan internasional
# Tanggal: 17 Oktober 2026
# Versi: 1.0 (master YAML phase 9)
# =============================================================================

meta:
  era: "Era Orde Lama"
  periode: "1950–1965 M (15 tahun)"
  lokasi_geografis: "Seluruh Indonesia — Jakarta, Bandung, Yogyakarta, Sumatera, Sulawesi, Maluku, Papua"
  penguasa: "Republik Indonesia (RI) — Demokrasi Liberal (1950-1959) → Demokrasi Terpimpin (1959-1965)"
  ibu_kota: "Jakarta"
  agama: "Islam (mayoritas), Kristen, Hindu-Buddha, Marxisme/Ateisme"
  sumber_primer:
    - "Dokumen pemerintahan RI — di ANRI"
    - "Dokumen G30S — Sidang Mahmilub 1966-1978"
    - "Dokumen PKI/Comintern — di IISG Amsterdam dan RGASPI Moscow"
    - "Arsip CIA — operasi rahasia AS mendukung PRRI/Permesta 1958"
    - "Arsip Soviet — hubungan RI-Soviet (Trikora, senjata)"
    - "Naskah pidato Soekarno — Trikora, Ganyang Malaysia, dll."
    - "Dokumen KAA 1955 — di Kementerian Luar Negeri RI"
    - "Sumber akademis: M.C. Ricklefs, Robert Cribb (Historical Atlas), John Roosa (Pretext for Mass Murder)"
  catatan_penting: >
    Era Orde Lama adalah era paling kompleks dalam sejarah Indonesia modern —
    konflik politik internal (NASAKOM, Demokrasi Terpimpin), 8 pemberontakan
    daerah (DI/TII, PRRI/Permesta, RMS, Madiun), hubungan internasional aktif
    (KAA 1955, Trikora, Dwikora, Non-Blok), dan klimaks G30S 1965.

# =============================================================================
# NARASI SINGKAT
# =============================================================================
narrative:
  era_overview: >
    Era Orde Lama adalah era paling kompleks dalam sejarah Indonesia modern.
    Dari Demokrasi Liberal yang tidak stabil, melalui Dekrit Presiden 5 Juli
    1959 yang melahirkan Demokrasi Terpimpin, hingga klimaks G30S 1965 yang
    mengakhiri era Soekarno. Era ini diwarnai oleh 8 pemberontakan daerah,
    agenda luar negeri visioner (KAA 1955, Trikora, Dwikora, Non-Blok), dan
    konflik internal tiga kekuatan: Nasionalis-Agama-Komunis (NASAKOM).

  akt_1_democracy: >
    1950-1959. Demokrasi Liberal — parlementer multipartai yang tidak stabil.
    Pemilu 1955 — 4 partai besar: PNI, Masyumi, NU, PKI. Kabinet silih berganti.
    Konstituante gagal menyusun UUD baru. Militer daerah merasa tidak dihargai.
    8 pemberontakan daerah meletus: DI/TII (Jawa Barat, Sulawesi, Aceh,
    Kalimantan), PRRI/Permesta (Sumatera, Sulawesi), RMS (Maluku), Madiun 1948.

  akt_2_guided_democracy: >
    5 Juli 1959. Dekrit Presiden Soekarno — bubarkan Konstituante, kembali ke
    UUD 1945. Demokrasi Terpimpin dimulai. NASAKOM — Nasionalis (PNI) +
    Agama (NU) + Komunis (PKI). Soekarno jadi kepala negara dengan kekuasaan
    penuh. PKI tumbuh menjadi 3 juta anggota di bawah D.N. Aidit.

  akt_3_international_vision: >
    1955: Konferensi Asia-Afrika di Bandung — 29 negara, Dasasila Bandung,
    cikal-bakal Gerakan Non-Blok. 1961: Trikora — pembebasan Irian Barat dari
    Belanda, dengan dukungan senjata Soviet. 1963: Ganyang Malaysia (Dwikora) —
    konfrontasi dengan Malaysia-Inggris-Australia di Kalimantan. Soekarno
    menjadi pemimpin Dunia Ketiga bersama Tito, Nehru, Nasser.

  akt_4_catastrophe: >
    30 September 1965. G30S — Letkol Untung memimpin penculikan dan pembunuhan
    7 jenderal TNI AD. Soeharto (Kostrad) menumpas dalam 2 hari. PKI dituduh
    sebagai dalang. Pembantaian massal terhadap anggota/simpatisan PKI —
    500.000-1.000.000 jiwa. D.N. Aidit dieksekusi 22 November 1965.
    11 Maret 1966: Supersemar — Soekarno menyerahkan kekuasaan ke Soeharto.
    Era Orde Lama berakhir. Era Orde Baru dimulai.

# =============================================================================
# KONFLIK POLITIK INTERNAL
# =============================================================================
internal_conflicts:
  note: >
    Era Orde Lama diwarnai oleh berbagai konflik politik internal yang akhirnya
    memuncak pada krisis 1965.
  phases:
    - name: "Demokrasi Liberal"
      period: "1950-1959"
      characteristics: "Parlementer multipartai tidak stabil, kabinet silih berganti"
      pemilu_1955: "4 partai besar: PNI, Masyumi, NU, PKI"
    - name: "Dekrit Presiden 5 Juli 1959"
      event: "Soekarno membubarkan Konstituante, kembali ke UUD 1945"
      result: "Demokrasi Terpimpin (1959-1965) dengan NASAKOM"
    - name: "NASAKOM"
      concept: "Nasionalis (PNI) + Agama (NU/Masyumi) + Komunis (PKI)"
      result: "Koalisi tiga kekuatan politik yang akhirnya pecah pada G30S 1965"

