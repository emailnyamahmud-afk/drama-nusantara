    name: "Trikora (Tri Komando Rakyat)"
    date: "19 Desember 1961 - 1 Mei 1963"
    goal: "Pembebasan Irian Barat dari Belanda"
    three_commands: ["Gagalkan pembentukan negara Papua buatan Belanda", "Heibarkan bendera Merah Putih di Irian Barat", "Bersiap untuk mobilisasi umum"]
    military_operation: "Operasi Mandala dipimpin Mayor Jenderal Suharto"
