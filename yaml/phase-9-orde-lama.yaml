  dwikora:
    name: "Dwikora (Dwi Komando Rakyat) — Ganyang Malaysia"
    date: "25 September 1963 - 11 Agustus 1966"
    cause: "Soekarno menolak pembentukan Malaysia (dianggap negara boneka imperialis)"
    military_operation: "Konfrontasi Borneo — pasukan Indonesia vs Malaysia-Inggris-Australia"
    key_military: ["Ahmad Yani", "Sarwo Edhie Wibowo (RPKAD)"]
    result: "Berakhir 11 Agustus 1966 setelah Supersemar (Soeharto menghentikan konfrontasi)"

  non_blok:
    name: "Gerakan Non-Blok"
    founded: "1961, Beograd"
    founders: ["Soekarno (Indonesia)", "Tito (Yugoslavia)", "Nehru (India)", "Nasser (Mesir)", "Nkrumah (Ghana)"]
    role: "Indonesia menjadi pemimpin blok netral — tidak pro-Barat, tidak pro-Timur"

